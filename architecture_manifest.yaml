state_machines:
  - entity: "Homework"
    states: ["DRAFT", "PUBLISHED", "IN_PROGRESS", "SUBMITTED", "GRADED", "ARCHIVED"]
    initial_state: "DRAFT"
    forbidden_transitions:
      - "DRAFT -> GRADED"
      - "SUBMITTED -> PUBLISHED"

  - entity: "ExamSubmission"
    states: ["NOT_STARTED", "IN_PROGRESS", "SUBMITTED", "GRADED"]
    initial_state: "NOT_STARTED"
    forbidden_transitions:
      - "GRADED -> IN_PROGRESS"

exit_criteria_sprint_1:
  tier_0_verified_required: true
  zero_schema_drift: true
  zero_orphan_records: true
  zero_ambiguous_relationships: true
