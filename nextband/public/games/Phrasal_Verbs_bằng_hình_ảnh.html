<script type="application/json" id="src-look6">"<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Cognitive Grammar 3D: Dark Twilight Theme<\/title>\n  <style>\n    /* Chuyển đổi toàn bộ biến màu sang Dark Mode */\n    :root {\n      --primary: #3b82f6; --primary-light: rgba(59, 130, 246, 0.2); \n      --accent-at: #ea580c; --accent-for: #22c55e; --accent-into: #a855f7;\n      --bg: #020617; /* Đen sâu */\n      --surface: #0f172a; /* Xanh đen */\n      --surface-hover: #1e293b;\n      --text: #f8fafc; /* Trắng sáng */\n      --text-muted: #94a3b8; /* Xám nhạt */\n      --border: #334155;\n      --radius: 12px;\n    }\n    \n    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; }\n    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }\n\n    /* Layout */\n    .sidebar { width: 420px; min-width: 360px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 4px 0 30px rgba(0,0,0,0.5); z-index: 10; transition: all 0.3s; }\n    .main-viewport { flex: 1; position: relative; height: 100%; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); overflow: hidden; }\n    #webgl-canvas { width: 100%; height: 100%; display: block; outline: none; }\n\n    /* Sidebar Content */\n    .header { padding: 24px; border-bottom: 1px solid var(--border); }\n    .tag { display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px; background: var(--primary-light); color: #60a5fa; margin-bottom: 8px; border: 1px solid rgba(59, 130, 246, 0.3); }\n    h1 { font-size: 1.35rem; font-weight: 800; line-height: 1.3; color: var(--text); }\n    .content-body { flex: 1; padding: 24px; overflow-y: auto; }\n    \n    /* Scrollbar tối màu */\n    .content-body::-webkit-scrollbar { width: 6px; }\n    .content-body::-webkit-scrollbar-track { background: var(--surface); }\n    .content-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }\n\n    .step-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }\n    .step-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; line-height: 1.3; color: #fff; }\n    \n    .schema-card { background: rgba(0, 0, 0, 0.2); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 16px; font-size: 0.9rem; }\n    .schema-card strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 0.95rem; }\n    .explanation { font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 16px; }\n    \n    .example-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); }\n    .example-box.at { border-left: 4px solid var(--accent-at); }\n    .example-box.for { border-left: 4px solid var(--accent-for); }\n    .example-box.into { border-left: 4px solid var(--accent-into); }\n    .example-box .en { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; color: #fff; }\n    .example-box .vi { font-size: 0.85rem; color: var(--text-muted); }\n\n    /* Controls */\n    .controls { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n    .btn { padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface-hover); color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; }\n    .btn:hover:not(:disabled) { background: #334155; border-color: #475569; }\n    .btn:disabled { opacity: 0.3; cursor: not-allowed; }\n    .btn-primary { background: var(--primary); color: #ffffff; border-color: var(--primary); box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }\n    .btn-primary:hover:not(:disabled) { background: #2563eb; box-shadow: 0 0 20px rgba(37, 99, 235, 0.6); }\n    .step-dots { display: flex; gap: 6px; }\n    .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }\n    .dot.active { width: 24px; border-radius: 4px; background: var(--primary); box-shadow: 0 0 8px var(--primary); }\n\n    /* 3D Smart Labels - Dark Frosted Glass */\n    .annotation-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }\n    .label-3d { position: absolute; transform: translate(-50%, -100%); background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: #f8fafc; box-shadow: 0 10px 25px rgba(0,0,0,0.5); white-space: nowrap; pointer-events: none; transition: opacity 0.3s ease, transform 0.1s; display: flex; align-items: center; gap: 8px; z-index: 20; }\n    .label-3d::after { content: \"\"; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid rgba(15, 23, 42, 0.85); }\n    .badge-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }\n    \n    .helper-text { position: absolute; bottom: 20px; right: 20px; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); border: 1px solid var(--border); pointer-events: none; }\n\n    @media (max-width: 768px) {\n      body { flex-direction: column; }\n      .sidebar { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }\n      .main-viewport { height: 55vh; }\n      .header { padding: 12px 16px; } h1 { font-size: 1.15rem; }\n      .content-body { padding: 12px 16px; } .controls { padding: 12px 16px; }\n    }\n  \n    /* ===== GIAO DIỆN SÁNG DỊU: tông giấy ấm ===== */\n    :root{--primary:#4f6bd8;--primary-light:rgba(79,107,216,.12);--bg:#f6f3ec;--surface:#fdfcf9;--surface-hover:#efe9dc;--text:#2f3a4a;--text-muted:#6b7686;--border:#e3dccd;--accent-over:#d9951a;--accent-through:#1596b4;--accent-up:#d6477f;color-scheme:light}\n    .sidebar{box-shadow:4px 0 24px rgba(70,60,40,.07)}\n    .main-viewport{background:radial-gradient(circle at center,#f4f1ea 0%,#e2ddd0 100%)}\n    .tag{color:#3f5fb8;border-color:rgba(79,107,216,.28)}\n    .step-title{color:var(--text)}\n    .schema-card{background:rgba(47,58,74,.05)}\n    .explanation{color:#4b5563}\n    .example-box{background:#fff;box-shadow:0 1px 3px rgba(70,60,40,.08)}\n    .example-box .en{color:var(--text)}\n    .btn:hover:not(:disabled){background:#e6dfd0;border-color:#cfc6b3}\n    .btn-primary{color:#fff;box-shadow:0 2px 8px rgba(79,107,216,.28)}\n    .btn-primary:hover:not(:disabled){background:#425cc4;box-shadow:0 3px 10px rgba(79,107,216,.35)}\n    .dot{background:#cfc7b6}.dot.active{box-shadow:none}\n    .label-3d{background:rgba(255,255,255,.94);border-color:rgba(47,58,74,.12);color:var(--text);box-shadow:0 4px 14px rgba(70,60,40,.14)}\n    .label-3d span:not(.badge-dot){color:var(--text)!important}\n    .label-3d::after{border-top-color:rgba(255,255,255,.94)}\n    .badge-dot{box-shadow:none}\n    .helper-text{background:rgba(255,255,255,.8);color:var(--text-muted)}\n    .content-body::-webkit-scrollbar-track{background:var(--surface)}\n  <\/style>\n<\/head>\n<body>\n\n  <aside class=\"sidebar\">\n    <div class=\"header\">\n      <span class=\"tag\">Cognitive Linguistics 3D<\/span>\n      <h1>Image Schemas: Look at, for, into<\/h1>\n    <\/div>\n    <div class=\"content-body\" id=\"text-container\"><\/div>\n    <footer class=\"controls\">\n      <button class=\"btn\" id=\"btn-prev\" disabled><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M19 12H5M12 19l-7-7 7-7\"/><\/svg> Lùi<\/button>\n      <div class=\"step-dots\" id=\"dots-container\"><\/div>\n      <button class=\"btn btn-primary\" id=\"btn-next\">Tiếp <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M12 5l7 7-7 7\"/><\/svg><\/button>\n    <\/footer>\n  <\/aside>\n\n  <main class=\"main-viewport\">\n    <canvas id=\"webgl-canvas\"><\/canvas>\n    <div class=\"annotation-layer\" id=\"annotations\"><\/div>\n    <div class=\"helper-text\">🖱️ Kéo để xoay | Cuộn để zoom<\/div>\n  <\/main>\n\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n\n  <script>\n    /* 1. PEDAGOGICAL DATA */\n    const stepsData = [{\"id\": 0, \"badge\": \"BƯỚC 1 / 5\", \"name\": \"LOOK · nhìn có chủ đích\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"Look! The sun is rising.\", \"vi\": \"Nhìn kìa! Mặt trời đang mọc.\"}, \"camPos\": {\"x\": 2, \"y\": 3, \"z\": 9}, \"target\": {\"x\": -1, \"y\": 1.5, \"z\": 0}}, {\"id\": 1, \"badge\": \"BƯỚC 2 / 5\", \"name\": \"LOOK AT · nhìn vào một điểm\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"Look at the whiteboard.\", \"vi\": \"Nhìn vào bảng.\"}, \"camPos\": {\"x\": 3, \"y\": 3, \"z\": 6}, \"target\": {\"x\": 1.5, \"y\": 1.5, \"z\": 0}}, {\"id\": 2, \"badge\": \"BƯỚC 3 / 5\", \"name\": \"LOOK FOR · tìm kiếm\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"I'm looking for my keys.\", \"vi\": \"Tôi đang tìm chìa khóa.\"}, \"camPos\": {\"x\": 0, \"y\": 5, \"z\": 8}, \"target\": {\"x\": 1, \"y\": 1, \"z\": 0}}, {\"id\": 3, \"badge\": \"BƯỚC 4 / 5\", \"name\": \"LOOK INTO · điều tra\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"The police will look into the case.\", \"vi\": \"Cảnh sát sẽ điều tra vụ án.\"}, \"camPos\": {\"x\": 3, \"y\": 2.5, \"z\": 4.5}, \"target\": {\"x\": 1.5, \"y\": 1.5, \"z\": 0}}, {\"id\": 4, \"badge\": \"BƯỚC 5 / 5\", \"name\": \"So sánh at · for · into\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"at → for → into\", \"vi\": \"Kéo chuột để xoay và so sánh.\"}, \"camPos\": {\"x\": -2, \"y\": 6, \"z\": 12}, \"target\": {\"x\": 1.5, \"y\": 1, \"z\": 0}}];\n\n    /* 2. SCENE SETUP (DARK TWILIGHT) */\n    const canvas = document.getElementById('webgl-canvas');\n    const container = document.querySelector('.main-viewport');\n    const annotationContainer = document.getElementById('annotations');\n\n    const scene = new THREE.Scene();\n    // Màu nền bóng đêm (Slate 900)\n    scene.background = new THREE.Color(0xe9e5db);\n    scene.fog = new THREE.FogExp2(0xe9e5db, 0.035);\n\n    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\n    renderer.setSize(container.clientWidth, container.clientHeight);\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n    renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = 1.0;\n\n    const controls = new THREE.OrbitControls(camera, renderer.domElement);\n    controls.enableDamping = true; controls.dampingFactor = 0.05;\n    controls.maxPolarAngle = Math.PI / 2 + 0.05; controls.minDistance = 2; controls.maxDistance = 25;\n\n    let currentStep = 0, isTransitioning = false;\n    let targetCamPos = new THREE.Vector3().copy(stepsData[0].camPos);\n    let targetLookAt = new THREE.Vector3().copy(stepsData[0].target);\n\n    // Cinematic Lighting cho bối cảnh tối\n    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9); // Ánh sáng môi trường xanh xám\n    scene.add(ambientLight);\n    \n    const dirLight = new THREE.DirectionalLight(0xfff3df, 0.95); // Ánh trăng nhạt\n    dirLight.position.set(8, 15, -5);\n    dirLight.castShadow = true;\n    dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;\n    dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 30;\n    dirLight.shadow.camera.left = -10; dirLight.shadow.camera.right = 10;\n    dirLight.shadow.camera.top = 10; dirLight.shadow.camera.bottom = -10;\n    dirLight.shadow.bias = -0.0005;\n    scene.add(dirLight);\n\n    const fillLight = new THREE.PointLight(0x93a5f5, 0.35, 20); // Điểm sáng phụ góc hắt lên\n    fillLight.position.set(-5, 2, 5);\n    scene.add(fillLight);\n\n    // Sàn phản quang bóng loáng (Reflective Floor)\n    const floorGeo = new THREE.PlaneGeometry(60, 60);\n    const floorMat = new THREE.MeshStandardMaterial({ color: 0xdcd6c9, roughness: 0.95, metalness: 0 });\n    const floor = new THREE.Mesh(floorGeo, floorMat);\n    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;\n    scene.add(floor);\n    \n    // Grid sậm màu Neon\n    const grid = new THREE.GridHelper(60, 60, 0xcbc4b3, 0xd9d3c5);\n    grid.position.y = 0.01; scene.add(grid);\n\n    /* 3. IMPROVED 3D MODELS */\n    const rootGroup = new THREE.Group(); scene.add(rootGroup);\n\n    // --- A. THE OBSERVER (FIXED EYE TRACKING) ---\n    const observerGroup = new THREE.Group();\n    observerGroup.position.set(-3, 1.5, 0);\n\n    const eyeball = new THREE.Group();\n    eyeball.position.set(0, 0, 0); \n\n    const scleraGeo = new THREE.SphereGeometry(0.6, 64, 64);\n    const scleraMat = new THREE.MeshPhysicalMaterial({\n      color: 0xe2e8f0, roughness: 0.2, metalness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.1\n    });\n    const sclera = new THREE.Mesh(scleraGeo, scleraMat);\n    sclera.castShadow = true;\n    eyeball.add(sclera);\n    \n    const irisGeo = new THREE.SphereGeometry(0.61, 64, 64, 0, Math.PI * 2, 0, Math.PI / 5);\n    const irisMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.1, emissive: 0x1e3a8a, emissiveIntensity: 0.2 });\n    const iris = new THREE.Mesh(irisGeo, irisMat);\n    iris.rotation.x = Math.PI / 2;\n    eyeball.add(iris);\n\n    const pupilGeo = new THREE.SphereGeometry(0.62, 32, 32, 0, Math.PI * 2, 0, Math.PI / 12);\n    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x020617 });\n    const pupil = new THREE.Mesh(pupilGeo, pupilMat);\n    pupil.rotation.x = Math.PI / 2;\n    eyeball.add(pupil);\n\n    observerGroup.add(eyeball);\n\n    // Bệ đỡ Cyberpunk\n    const pedestalGeo = new THREE.CylinderGeometry(0.3, 0.5, 1.5, 32);\n    const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.7 });\n    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);\n    pedestal.position.y = -0.75; pedestal.castShadow = true; pedestal.receiveShadow = true;\n    observerGroup.add(pedestal);\n\n    const ringGeo = new THREE.TorusGeometry(0.4, 0.05, 16, 32);\n    // Vòng sáng nổi bật hơn trong bóng đêm\n    const ringMat = new THREE.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x3b82f6, emissiveIntensity: 1.5 });\n    const ring = new THREE.Mesh(ringGeo, ringMat);\n    ring.rotation.x = Math.PI / 2; ring.position.y = -0.1;\n    observerGroup.add(ring);\n\n    rootGroup.add(observerGroup);\n\n    // --- B. GAZE BEAMS ---\n    const beamsGroup = new THREE.Group(); \n    eyeball.add(beamsGroup);\n\n    const laserLength = 5.5;\n    const laserGeo = new THREE.CylinderGeometry(0.025, 0.025, laserLength, 16);\n    laserGeo.translate(0, laserLength/2, 0); \n    const laserMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });\n    const laserBeam = new THREE.Mesh(laserGeo, laserMat);\n    laserBeam.rotation.x = Math.PI / 2; \n    laserBeam.position.set(0, 0, 0.5); \n    beamsGroup.add(laserBeam);\n\n    const glowGeo = new THREE.CylinderGeometry(0.12, 0.12, laserLength, 16);\n    glowGeo.translate(0, laserLength/2, 0);\n    const glowMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });\n    const laserGlow = new THREE.Mesh(glowGeo, glowMat);\n    laserGlow.rotation.x = Math.PI / 2;\n    laserGlow.position.set(0, 0, 0.5);\n    beamsGroup.add(laserGlow);\n\n    const coneLength = 5.5;\n    const coneGeo = new THREE.ConeGeometry(2.5, coneLength, 64, 1, true);\n    coneGeo.translate(0, coneLength/2, 0);\n    const coneMat = new THREE.MeshPhysicalMaterial({ \n      color: 0x4ade80, emissive: 0x22c55e, emissiveIntensity: 0.3,\n      transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending\n    });\n    const radarCone = new THREE.Mesh(coneGeo, coneMat);\n    radarCone.rotation.x = Math.PI / 2;\n    radarCone.position.set(0, 0, 0.5);\n    radarCone.visible = false;\n    beamsGroup.add(radarCone);\n\n    // --- C. TARGETS SETUP ---\n    const posAt = new THREE.Vector3(3, 1.5, -2.5);\n    const posFor = new THREE.Vector3(3, 0, 0);\n    const posInto = new THREE.Vector3(3, 1.5, 2.5);\n\n    // 1. LOOK AT\n    const atGroup = new THREE.Group();\n    const atSphereGeo = new THREE.SphereGeometry(0.6, 64, 64);\n    const atSphereMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.2, metalness: 0.4, emissive: 0xc2410c, emissiveIntensity: 0.2 });\n    const atTarget = new THREE.Mesh(atSphereGeo, atSphereMat);\n    atTarget.castShadow = true; atTarget.receiveShadow = true;\n    atGroup.add(atTarget);\n    \n    const atRingGeo = new THREE.RingGeometry(0.7, 0.8, 64);\n    const atRingMat = new THREE.MeshBasicMaterial({ color: 0xfdba74, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });\n    const atRing = new THREE.Mesh(atRingGeo, atRingMat);\n    atRing.rotation.y = Math.PI / 2;\n    atGroup.add(atRing);\n    \n    const atBase = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 1.5, 32), pedestalMat);\n    atBase.position.y = -0.75; atBase.castShadow = true;\n    atGroup.add(atBase);\n    rootGroup.add(atGroup);\n\n    // 2. LOOK FOR\n    const forGroup = new THREE.Group();\n    const wallGeo = new THREE.BoxGeometry(0.5, 2.5, 3.5);\n    const wallMat = new THREE.MeshPhysicalMaterial({ \n      color: 0x64748b, transparent: true, opacity: 0.3, roughness: 0.1, transmission: 0.8, thickness: 0.5 \n    });\n    const wall = new THREE.Mesh(wallGeo, wallMat);\n    wall.position.set(0, 1.25, 0); wall.castShadow = true;\n    forGroup.add(wall);\n\n    const gemGeo = new THREE.OctahedronGeometry(0.4);\n    // Đá quý sáng rực trong bóng đêm\n    const gemMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, emissive: 0x22c55e, emissiveIntensity: 1.0, roughness: 0.1, metalness: 0.8 });\n    const gem = new THREE.Mesh(gemGeo, gemMat);\n    gem.position.set(1.2, 1.5, 0); gem.castShadow = true;\n    \n    const gemGlow = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending }));\n    gem.add(gemGlow);\n    forGroup.add(gem);\n    rootGroup.add(forGroup);\n\n    // 3. LOOK INTO\n    const intoGroup = new THREE.Group();\n    const prismGeo = new THREE.CylinderGeometry(0.9, 0.9, 1.8, 6);\n    const prismMat = new THREE.MeshPhysicalMaterial({\n      color: 0xd8b4fe, transparent: true, opacity: 0.2,\n      roughness: 0.05, transmission: 0.95, thickness: 1.0, ior: 1.5, side: THREE.DoubleSide\n    });\n    const prism = new THREE.Mesh(prismGeo, prismMat);\n    prism.castShadow = true;\n    intoGroup.add(prism);\n\n    const prismEdges = new THREE.LineSegments(new THREE.EdgesGeometry(prismGeo), new THREE.LineBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.8 }));\n    intoGroup.add(prismEdges);\n\n    const coreGeo = new THREE.IcosahedronGeometry(0.35, 1);\n    const coreMat = new THREE.MeshBasicMaterial({ color: 0xfde047, blending: THREE.AdditiveBlending });\n    const core = new THREE.Mesh(coreGeo, coreMat);\n    const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), new THREE.MeshBasicMaterial({ color: 0xeab308, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending }));\n    core.add(coreGlow);\n    intoGroup.add(core);\n\n    const intoBase = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 1.5, 32), pedestalMat);\n    intoBase.position.y = -0.75; intoBase.castShadow = true;\n    intoGroup.add(intoBase);\n    rootGroup.add(intoGroup);\n\n    /* 4. SMART LABELS SYSTEM */\n    const getWPos = (obj, dy = 0) => {\n      const v = new THREE.Vector3();\n      obj.getWorldPosition(v);\n      v.y += dy;\n      return v;\n    };\n\n    const getVectorLabelPos = () => {\n      const v = new THREE.Vector3();\n      laserBeam.getWorldPosition(v);\n      const dir = new THREE.Vector3(0,0,1).applyQuaternion(eyeball.quaternion);\n      v.add(dir.multiplyScalar(2.5));\n      v.y += 0.5;\n      return v;\n    };\n\n    const labelsData = [\n      { id: 'lbl-obs', text: 'Observer', color: '#3b82f6', getPos: () => getWPos(eyeball, 1.2), steps: [0,1,2,3] },\n      { id: 'lbl-beam', text: 'Gaze Vector', color: '#93c5fd', getPos: getVectorLabelPos, steps: [0,1,3] },\n      { id: 'lbl-radar', text: 'Search Radar', color: '#4ade80', getPos: getVectorLabelPos, steps: [2] },\n      { id: 'lbl-at', text: 'Surface Focus (At)', color: '#f97316', getPos: () => getWPos(atTarget, 1.2), steps: [1,4] },\n      { id: 'lbl-for', text: 'Missing Goal (For)', color: '#22c55e', getPos: () => getWPos(gem, 1.2), steps: [2,4] },\n      { id: 'lbl-into-box', text: 'Boundary', color: '#c084fc', getPos: () => getWPos(prism, 1.3), steps: [3] },\n      { id: 'lbl-into-core', text: 'Deep Core (Into)', color: '#eab308', getPos: () => getWPos(core, 0.9), steps: [3,4] },\n    ];\n\n    labelsData.forEach(l => {\n      const div = document.createElement('div');\n      div.className = 'label-3d'; div.id = l.id;\n      div.innerHTML = `<span class=\"badge-dot\" style=\"background:${l.color}\"><\/span><span style=\"color:${l.color}\">${l.text}<\/span>`;\n      annotationContainer.appendChild(div);\n    });\n\n    function updateLabels() {\n      const tempV = new THREE.Vector3();\n      labelsData.forEach(l => {\n        const el = document.getElementById(l.id);\n        if (!el) return;\n        \n        if (!l.steps.includes(currentStep)) {\n          el.style.opacity = '0'; return;\n        }\n\n        tempV.copy(l.getPos());\n        tempV.project(camera);\n\n        if (tempV.z > 1) { el.style.opacity = '0'; return; }\n\n        const x = (tempV.x * 0.5 + 0.5) * container.clientWidth;\n        const y = (-(tempV.y * 0.5) + 0.5) * container.clientHeight;\n\n        el.style.left = `${x}px`; el.style.top = `${y}px`;\n        el.style.opacity = '1';\n      });\n    }\n\n    /* 5. STATE & LOGIC SYNCHRONIZATION */\n    const textContainer = document.getElementById('text-container');\n    const dotsContainer = document.getElementById('dots-container');\n    const btnPrev = document.getElementById('btn-prev');\n    const btnNext = document.getElementById('btn-next');\n\n    stepsData.forEach((s, idx) => {\n      const dot = document.createElement('div');\n      dot.className = `dot ${idx === 0 ? 'active' : ''}`;\n      dotsContainer.appendChild(dot);\n    });\n\n    function renderUI(stepIdx) {\n      const step = stepsData[stepIdx];\n      let boxClass = stepIdx === 1 || stepIdx === 4 ? 'at' : (stepIdx === 2 ? 'for' : (stepIdx === 3 ? 'into' : 'at'));\n\n      textContainer.innerHTML = `\n        <div class=\"step-badge\">${step.badge}<\/div>\n        <h2 class=\"step-title\">${step.name}<\/h2>\n        ${step.schemaDesc?`<div class=\"schema-card\"><strong>${step.schemaTitle}<\/strong>${step.schemaDesc}<\/div>`:''}\n        ${step.body?`<p class=\"explanation\">${step.body}<\/p>`:''}\n        <div class=\"example-box ${boxClass}\">\n          <div class=\"en\">💬 \"${step.example.en}\"<\/div>\n          <div class=\"vi\">${step.example.vi}<\/div>\n        <\/div>\n      `;\n\n      btnPrev.disabled = stepIdx === 0;\n      btnNext.innerHTML = stepIdx === stepsData.length - 1 ? 'Khám phá <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M12 5l7 7-7 7\"/><\/svg>' : 'Tiếp <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M12 5l7 7-7 7\"/><\/svg>';\n      \n      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === stepIdx));\n\n      targetCamPos.set(step.camPos.x, step.camPos.y, step.camPos.z);\n      targetLookAt.set(step.target.x, step.target.y, step.target.z);\n      isTransitioning = true;\n\n      sync3D(stepIdx);\n    }\n\n    function sync3D(step) {\n      atGroup.visible = false; forGroup.visible = false; intoGroup.visible = false;\n      laserBeam.visible = false; laserGlow.visible = false; radarCone.visible = false;\n\n      atGroup.position.set(2, 0, 0);\n      forGroup.position.set(2, 0, 0);\n      intoGroup.position.set(2, 0, 0);\n\n      if (step === 0) {\n        laserBeam.visible = true; laserGlow.visible = true;\n        laserMat.color.setHex(0x93c5fd); glowMat.color.setHex(0x3b82f6);\n      } else if (step === 1) {\n        atGroup.visible = true; laserBeam.visible = true; laserGlow.visible = true;\n        laserMat.color.setHex(0xfdba74); glowMat.color.setHex(0xf97316); // Cam phát sáng\n      } else if (step === 2) {\n        forGroup.visible = true; radarCone.visible = true;\n      } else if (step === 3) {\n        intoGroup.visible = true; laserBeam.visible = true; laserGlow.visible = true;\n        laserMat.color.setHex(0xd8b4fe); glowMat.color.setHex(0xa855f7); // Tím neon\n      } else if (step === 4) {\n        atGroup.visible = true; atGroup.position.copy(posAt);\n        forGroup.visible = true; forGroup.position.copy(posFor);\n        intoGroup.visible = true; intoGroup.position.copy(posInto);\n      }\n    }\n\n    btnNext.addEventListener('click', () => {\n      if (currentStep < stepsData.length - 1) { currentStep++; renderUI(currentStep); } \n      else { isTransitioning = false; }\n    });\n    btnPrev.addEventListener('click', () => {\n      if (currentStep > 0) { currentStep--; renderUI(currentStep); }\n    });\n    controls.addEventListener('start', () => { isTransitioning = false; });\n\n    /* 6. ANIMATION LOOP */\n    const clock = new THREE.Clock();\n    const currentLookTarget = new THREE.Vector3(5, 1.5, 0);\n\n    function animate() {\n      requestAnimationFrame(animate);\n      const elapsedTime = clock.getElapsedTime();\n\n      // Camera Lerp\n      if (isTransitioning) {\n        camera.position.lerp(targetCamPos, 0.05);\n        controls.target.lerp(targetLookAt, 0.05);\n        controls.update();\n        if (camera.position.distanceTo(targetCamPos) < 0.1 && controls.target.distanceTo(targetLookAt) < 0.1) {\n          isTransitioning = false;\n        }\n      } else {\n        controls.update();\n      }\n\n      // Eye Tracking\n      let targetLookPos = new THREE.Vector3(5, 1.5, 0);\n      if (currentStep === 1) {\n        atTarget.getWorldPosition(targetLookPos);\n      } else if (currentStep === 2) {\n        gem.getWorldPosition(targetLookPos);\n      } else if (currentStep === 3) {\n        core.getWorldPosition(targetLookPos);\n      } else if (currentStep === 4) {\n        const cycle = (Math.sin(elapsedTime * 0.7) + 1) / 2;\n        if (cycle < 0.33) targetLookPos.copy(posAt);\n        else if (cycle < 0.66) targetLookPos.copy(posFor);\n        else targetLookPos.copy(posInto);\n        targetLookPos.y += 1.5;\n      }\n      currentLookTarget.lerp(targetLookPos, 0.1);\n      eyeball.lookAt(currentLookTarget);\n\n      // Float animations\n      observerGroup.position.y = 1.5 + Math.sin(elapsedTime * 2) * 0.05;\n\n      if (laserBeam.visible) {\n        laserMat.opacity = 0.8 + Math.sin(elapsedTime * 15) * 0.2;\n        glowMat.opacity = 0.3 + Math.sin(elapsedTime * 15) * 0.2;\n      }\n\n      if (radarCone.visible) {\n        radarCone.rotation.z = Math.sin(elapsedTime * 3) * 0.1;\n        radarCone.rotation.y = Math.sin(elapsedTime * 2) * 0.1;\n        gem.rotation.y += 0.02; gem.position.y = 1.5 + Math.sin(elapsedTime * 4) * 0.1;\n      }\n\n      if (atGroup.visible) {\n        const s = 1 + Math.sin(elapsedTime * 5) * 0.08;\n        atRing.scale.set(s,s,s);\n      }\n\n      if (intoGroup.visible) {\n        core.rotation.x += 0.01; core.rotation.y += 0.02;\n        prism.rotation.y = Math.sin(elapsedTime * 0.3) * 0.1;\n      }\n\n      renderer.render(scene, camera);\n      updateLabels();\n    }\n\n    window.addEventListener('resize', () => {\n      const width = container.clientWidth; const height = container.clientHeight;\n      camera.aspect = width / height; camera.updateProjectionMatrix();\n      renderer.setSize(width, height);\n    });\n\n    renderUI(0);\n    animate();\n  <\/script>\n<\/body>\n<\/html>"</script>
<script type="application/json" id="src-look3">"<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Cognitive Grammar 3D: Look over, through, up to<\/title>\n  <style>\n    :root {\n      --primary: #3b82f6; --primary-light: rgba(59, 130, 246, 0.2); \n      --accent-over: #eab308; --accent-through: #06b6d4; --accent-up: #ec4899;\n      --bg: #020617; --surface: #0f172a; --surface-hover: #1e293b;\n      --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --radius: 12px;\n    }\n    \n    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; }\n    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }\n\n    .sidebar { width: 420px; min-width: 360px; height: 100%; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 4px 0 30px rgba(0,0,0,0.5); z-index: 10; transition: all 0.3s; }\n    .main-viewport { flex: 1; position: relative; height: 100%; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); overflow: hidden; }\n    #webgl-canvas { width: 100%; height: 100%; display: block; outline: none; }\n\n    .header { padding: 24px; border-bottom: 1px solid var(--border); }\n    .tag { display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px; background: var(--primary-light); color: #60a5fa; margin-bottom: 8px; border: 1px solid rgba(59, 130, 246, 0.3); }\n    h1 { font-size: 1.35rem; font-weight: 800; line-height: 1.3; color: var(--text); }\n    .content-body { flex: 1; padding: 24px; overflow-y: auto; }\n    \n    .content-body::-webkit-scrollbar { width: 6px; }\n    .content-body::-webkit-scrollbar-track { background: var(--surface); }\n    .content-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }\n\n    .step-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }\n    .step-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; line-height: 1.3; color: #fff; }\n    \n    .schema-card { background: rgba(0, 0, 0, 0.2); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 16px; font-size: 0.9rem; }\n    .schema-card strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 0.95rem; }\n    .explanation { font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 16px; }\n    \n    .example-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); }\n    .example-box.over { border-left: 4px solid var(--accent-over); }\n    .example-box.through { border-left: 4px solid var(--accent-through); }\n    .example-box.up { border-left: 4px solid var(--accent-up); }\n    .example-box .en { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; color: #fff; }\n    .example-box .vi { font-size: 0.85rem; color: var(--text-muted); }\n\n    .controls { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n    .btn { padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface-hover); color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; }\n    .btn:hover:not(:disabled) { background: #334155; border-color: #475569; }\n    .btn:disabled { opacity: 0.3; cursor: not-allowed; }\n    .btn-primary { background: var(--primary); color: #ffffff; border-color: var(--primary); box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }\n    .btn-primary:hover:not(:disabled) { background: #2563eb; box-shadow: 0 0 20px rgba(37, 99, 235, 0.6); }\n    .step-dots { display: flex; gap: 6px; }\n    .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }\n    .dot.active { width: 24px; border-radius: 4px; background: var(--primary); box-shadow: 0 0 8px var(--primary); }\n\n    .annotation-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }\n    .label-3d { position: absolute; transform: translate(-50%, -100%); background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: #f8fafc; box-shadow: 0 10px 25px rgba(0,0,0,0.5); white-space: nowrap; pointer-events: none; transition: opacity 0.3s ease, transform 0.1s; display: flex; align-items: center; gap: 8px; z-index: 20; }\n    .label-3d::after { content: \"\"; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid rgba(15, 23, 42, 0.85); }\n    .badge-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }\n    \n    .helper-text { position: absolute; bottom: 20px; right: 20px; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); border: 1px solid var(--border); pointer-events: none; }\n\n    @media (max-width: 768px) {\n      body { flex-direction: column; }\n      .sidebar { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }\n      .main-viewport { height: 55vh; }\n      .header { padding: 12px 16px; } h1 { font-size: 1.15rem; }\n      .content-body { padding: 12px 16px; } .controls { padding: 12px 16px; }\n    }\n  \n    /* ===== GIAO DIỆN SÁNG DỊU: tông giấy ấm ===== */\n    :root{--primary:#4f6bd8;--primary-light:rgba(79,107,216,.12);--bg:#f6f3ec;--surface:#fdfcf9;--surface-hover:#efe9dc;--text:#2f3a4a;--text-muted:#6b7686;--border:#e3dccd;--accent-over:#d9951a;--accent-through:#1596b4;--accent-up:#d6477f;color-scheme:light}\n    .sidebar{box-shadow:4px 0 24px rgba(70,60,40,.07)}\n    .main-viewport{background:radial-gradient(circle at center,#f4f1ea 0%,#e2ddd0 100%)}\n    .tag{color:#3f5fb8;border-color:rgba(79,107,216,.28)}\n    .step-title{color:var(--text)}\n    .schema-card{background:rgba(47,58,74,.05)}\n    .explanation{color:#4b5563}\n    .example-box{background:#fff;box-shadow:0 1px 3px rgba(70,60,40,.08)}\n    .example-box .en{color:var(--text)}\n    .btn:hover:not(:disabled){background:#e6dfd0;border-color:#cfc6b3}\n    .btn-primary{color:#fff;box-shadow:0 2px 8px rgba(79,107,216,.28)}\n    .btn-primary:hover:not(:disabled){background:#425cc4;box-shadow:0 3px 10px rgba(79,107,216,.35)}\n    .dot{background:#cfc7b6}.dot.active{box-shadow:none}\n    .label-3d{background:rgba(255,255,255,.94);border-color:rgba(47,58,74,.12);color:var(--text);box-shadow:0 4px 14px rgba(70,60,40,.14)}\n    .label-3d span:not(.badge-dot){color:var(--text)!important}\n    .label-3d::after{border-top-color:rgba(255,255,255,.94)}\n    .badge-dot{box-shadow:none}\n    .helper-text{background:rgba(255,255,255,.8);color:var(--text-muted)}\n    .content-body::-webkit-scrollbar-track{background:var(--surface)}\n  <\/style>\n<\/head>\n<body>\n\n  <aside class=\"sidebar\">\n    <div class=\"header\">\n      <span class=\"tag\">Cognitive Linguistics 3D • Phrasal Verbs<\/span>\n      <h1>Lược đồ Không gian: Over, Through, Up<\/h1>\n    <\/div>\n    <div class=\"content-body\" id=\"text-container\"><\/div>\n    <footer class=\"controls\">\n      <button class=\"btn\" id=\"btn-prev\" disabled><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M19 12H5M12 19l-7-7 7-7\"/><\/svg> Lùi<\/button>\n      <div class=\"step-dots\" id=\"dots-container\"><\/div>\n      <button class=\"btn btn-primary\" id=\"btn-next\">Tiếp <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M12 5l7 7-7 7\"/><\/svg><\/button>\n    <\/footer>\n  <\/aside>\n\n  <main class=\"main-viewport\">\n    <canvas id=\"webgl-canvas\"><\/canvas>\n    <div class=\"annotation-layer\" id=\"annotations\"><\/div>\n    <div class=\"helper-text\">🖱️ Kéo để xoay | Cuộn để zoom<\/div>\n  <\/main>\n\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n\n  <script>\n    /* 1. PEDAGOGICAL DATA: EXPANDED SCHEMAS */\n    const stepsData = [{\"id\": 0, \"badge\": \"BƯỚC 1 / 4\", \"name\": \"LOOK OVER · xem lướt\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"Could you look over this report?\", \"vi\": \"Bạn xem lướt bản báo cáo này giúp tôi nhé?\"}, \"camPos\": {\"x\": 0, \"y\": 5, \"z\": 8}, \"target\": {\"x\": 2, \"y\": 0, \"z\": 0}}, {\"id\": 1, \"badge\": \"BƯỚC 2 / 4\", \"name\": \"LOOK THROUGH · xem kỹ, nhìn thấu\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"Hoặc xem từ đầu đến cuối.\", \"example\": {\"en\": \"I can look right through his lies.\", \"vi\": \"Tôi nhìn thấu những lời nói dối của anh ta.\"}, \"camPos\": {\"x\": 2, \"y\": 2, \"z\": 7}, \"target\": {\"x\": 1, \"y\": 1.5, \"z\": 0}}, {\"id\": 2, \"badge\": \"BƯỚC 3 / 4\", \"name\": \"LOOK UP TO · ngưỡng mộ\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"Trái nghĩa: look down on = coi thường.\", \"example\": {\"en\": \"Kids always look up to their parents.\", \"vi\": \"Trẻ con luôn ngưỡng mộ cha mẹ.\"}, \"camPos\": {\"x\": 3, \"y\": 0.5, \"z\": 8}, \"target\": {\"x\": 2, \"y\": 3.5, \"z\": 0}}, {\"id\": 3, \"badge\": \"BƯỚC 4 / 4\", \"name\": \"So sánh over · through · up to\", \"schemaTitle\": \"\", \"schemaDesc\": \"\", \"body\": \"\", \"example\": {\"en\": \"over → through → up to\", \"vi\": \"Kéo chuột để xoay và so sánh.\"}, \"camPos\": {\"x\": -3, \"y\": 6, \"z\": 12}, \"target\": {\"x\": 2, \"y\": 1.5, \"z\": 0}}];\n\n    /* 2. SCENE SETUP (DARK TWILIGHT) */\n    const canvas = document.getElementById('webgl-canvas');\n    const container = document.querySelector('.main-viewport');\n    const annotationContainer = document.getElementById('annotations');\n\n    const scene = new THREE.Scene();\n    scene.background = new THREE.Color(0xe9e5db);\n    scene.fog = new THREE.FogExp2(0xe9e5db, 0.03);\n\n    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\n    renderer.setSize(container.clientWidth, container.clientHeight);\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n    renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = 1.0;\n\n    const controls = new THREE.OrbitControls(camera, renderer.domElement);\n    controls.enableDamping = true; controls.dampingFactor = 0.05;\n    controls.maxPolarAngle = Math.PI / 2 + 0.05; controls.minDistance = 2; controls.maxDistance = 25;\n\n    let currentStep = 0, isTransitioning = false;\n    let targetCamPos = new THREE.Vector3().copy(stepsData[0].camPos);\n    let targetLookAt = new THREE.Vector3().copy(stepsData[0].target);\n\n    // Lights\n    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);\n    scene.add(ambientLight);\n    \n    const dirLight = new THREE.DirectionalLight(0xfff3df, 0.95);\n    dirLight.position.set(8, 15, -5);\n    dirLight.castShadow = true;\n    dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;\n    scene.add(dirLight);\n\n    const floorGeo = new THREE.PlaneGeometry(60, 60);\n    const floorMat = new THREE.MeshStandardMaterial({ color: 0xdcd6c9, roughness: 0.95, metalness: 0 });\n    const floor = new THREE.Mesh(floorGeo, floorMat);\n    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;\n    scene.add(floor);\n    \n    const grid = new THREE.GridHelper(60, 60, 0xcbc4b3, 0xd9d3c5);\n    grid.position.y = 0.01; scene.add(grid);\n\n    /* 3. MODELS & SYSTEMS */\n    const rootGroup = new THREE.Group(); scene.add(rootGroup);\n\n    // --- A. THE OBSERVER (EYE) ---\n    const observerGroup = new THREE.Group();\n    observerGroup.position.set(-3, 1.8, 0); // Đặt cao hơn một chút\n\n    const eyeball = new THREE.Group();\n    const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.6, 64, 64), new THREE.MeshPhysicalMaterial({ color: 0xe2e8f0, roughness: 0.1, metalness: 0.2, clearcoat: 1.0 }));\n    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.61, 64, 64, 0, Math.PI * 2, 0, Math.PI / 5), new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1e3a8a, emissiveIntensity: 0.2 }));\n    iris.rotation.x = Math.PI / 2;\n    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 32, 0, Math.PI * 2, 0, Math.PI / 12), new THREE.MeshBasicMaterial({ color: 0x020617 }));\n    pupil.rotation.x = Math.PI / 2;\n    \n    eyeball.add(sclera, iris, pupil);\n    observerGroup.add(eyeball);\n\n    const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 1.8, 32), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.7 }));\n    pedestal.position.y = -0.9; pedestal.castShadow = true;\n    observerGroup.add(pedestal);\n    rootGroup.add(observerGroup);\n\n    // --- B. THE GAZE BEAM ---\n    const beamsGroup = new THREE.Group(); \n    eyeball.add(beamsGroup);\n\n    const laserLength = 7; // Dài hơn để xuyên thấu\n    const laserGeo = new THREE.CylinderGeometry(0.025, 0.025, laserLength, 16);\n    laserGeo.translate(0, laserLength/2, 0); \n    const laserMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });\n    const laserBeam = new THREE.Mesh(laserGeo, laserMat);\n    laserBeam.rotation.x = Math.PI / 2; laserBeam.position.set(0, 0, 0.5); \n    beamsGroup.add(laserBeam);\n\n    const glowGeo = new THREE.CylinderGeometry(0.12, 0.12, laserLength, 16);\n    glowGeo.translate(0, laserLength/2, 0);\n    const glowMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });\n    const laserGlow = new THREE.Mesh(glowGeo, glowMat);\n    laserGlow.rotation.x = Math.PI / 2; laserGlow.position.set(0, 0, 0.5);\n    beamsGroup.add(laserGlow);\n\n    // --- C. TARGETS FOR PHRASAL VERBS ---\n    const posOver = new THREE.Vector3(2.5, 0.1, -3);\n    const posThrough = new THREE.Vector3(2.5, 1.5, 0);\n    const posUp = new THREE.Vector3(2.5, 3.5, 3);\n\n    // 1. OVER (Bề mặt Blueprint đang sáng bừng)\n    const overGroup = new THREE.Group();\n    const blueprintGeo = new THREE.PlaneGeometry(3, 2.5);\n    const blueprintMat = new THREE.MeshStandardMaterial({ \n      color: 0x1e293b, emissive: 0xa16207, emissiveIntensity: 0.5, \n      side: THREE.DoubleSide, roughness: 0.8\n    });\n    const blueprint = new THREE.Mesh(blueprintGeo, blueprintMat);\n    blueprint.rotation.x = -Math.PI / 2; \n    \n    // Grid line trên blueprint\n    const bpGrid = new THREE.GridHelper(3, 10, 0xfacc15, 0xca8a04);\n    bpGrid.position.y = 0.02;\n    overGroup.add(blueprint, bpGrid);\n    \n    // Scanner Line (Hiệu ứng quét ngang)\n    const scannerGeo = new THREE.BoxGeometry(3, 0.05, 0.05);\n    const scannerMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, blending: THREE.AdditiveBlending });\n    const scannerLine = new THREE.Mesh(scannerGeo, scannerMat);\n    scannerLine.position.y = 0.05;\n    overGroup.add(scannerLine);\n    \n    rootGroup.add(overGroup);\n\n    // 2. THROUGH (Nhiều lớp Hologram kính/Giấy)\n    const throughGroup = new THREE.Group();\n    const pages = [];\n    for(let i=0; i<4; i++) {\n      const pageMat = new THREE.MeshPhysicalMaterial({ \n        color: 0x06b6d4, transparent: true, opacity: 0.25, \n        roughness: 0.1, transmission: 0.9, thickness: 0.1, side: THREE.DoubleSide\n      });\n      const page = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.5), pageMat);\n      // Đặt các trang kính xếp dọc trục Z của nhóm\n      page.position.set(0, 0, i * 0.8 - 1.2);\n      \n      // Khung viền sáng\n      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(page.geometry), new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.6 }));\n      page.add(edges);\n      \n      pages.push(page);\n      throughGroup.add(page);\n    }\n    \n    // Lõi bí mật đằng sau cùng\n    const secretGeo = new THREE.OctahedronGeometry(0.3);\n    const secretMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0891b2, emissiveIntensity: 2.0 });\n    const secretCore = new THREE.Mesh(secretGeo, secretMat);\n    secretCore.position.set(0, 0, 1.8);\n    throughGroup.add(secretCore);\n\n    rootGroup.add(throughGroup);\n\n    // 3. UP TO (Bức tượng / Đài tưởng niệm quyền lực)\n    const upGroup = new THREE.Group();\n    // Bệ đá cao\n    const monumentBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3, 1.2), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 }));\n    monumentBase.position.y = -2; // Giảm xuống để khớp vị trí tổng\n    monumentBase.castShadow = true;\n    upGroup.add(monumentBase);\n    \n    // Tinh thể quyền lực (Obelisk/Star)\n    const starGeo = new THREE.ConeGeometry(0.6, 1.5, 4);\n    const starMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, emissive: 0xdb2777, emissiveIntensity: 1.0, roughness: 0.1, metalness: 0.8 });\n    const starObj = new THREE.Mesh(starGeo, starMat);\n    starObj.position.y = 0; // Đỉnh tháp\n    starObj.castShadow = true;\n    \n    // Vòng hào quang quanh tháp\n    const haloGeo = new THREE.RingGeometry(0.8, 1.0, 32);\n    const haloMat = new THREE.MeshBasicMaterial({ color: 0xf472b6, side: THREE.DoubleSide, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });\n    const halo = new THREE.Mesh(haloGeo, haloMat);\n    halo.rotation.x = Math.PI / 2;\n    starObj.add(halo);\n    \n    upGroup.add(starObj);\n    rootGroup.add(upGroup);\n\n    /* 4. SMART LABELS SYSTEM */\n    const getWPos = (obj, dy = 0) => {\n      const v = new THREE.Vector3(); obj.getWorldPosition(v); v.y += dy; return v;\n    };\n    const getVectorLabelPos = () => {\n      const v = new THREE.Vector3(); laserBeam.getWorldPosition(v);\n      const dir = new THREE.Vector3(0,0,1).applyQuaternion(eyeball.quaternion);\n      v.add(dir.multiplyScalar(2.5)); v.y += 0.5; return v;\n    };\n\n    const labelsData = [\n      { id: 'lbl-obs', text: 'Observer', color: '#3b82f6', getPos: () => getWPos(eyeball, 1.2), steps: [0,1,2,3] },\n      { id: 'lbl-beam', text: 'Visual Vector', color: '#f8fafc', getPos: getVectorLabelPos, steps: [0,1,2,3] },\n      { id: 'lbl-over', text: 'Surface Scan (Over)', color: '#eab308', getPos: () => getWPos(blueprint, 0.8), steps: [0,3] },\n      { id: 'lbl-through', text: 'Penetration (Through)', color: '#06b6d4', getPos: () => getWPos(pages[0], 1.6), steps: [1,3] },\n      { id: 'lbl-up', text: 'Verticality/Power (Up)', color: '#ec4899', getPos: () => getWPos(starObj, 1.2), steps: [2,3] },\n    ];\n\n    labelsData.forEach(l => {\n      const div = document.createElement('div');\n      div.className = 'label-3d'; div.id = l.id;\n      div.innerHTML = `<span class=\"badge-dot\" style=\"background:${l.color}\"><\/span><span style=\"color:${l.color}\">${l.text}<\/span>`;\n      annotationContainer.appendChild(div);\n    });\n\n    function updateLabels() {\n      const tempV = new THREE.Vector3();\n      labelsData.forEach(l => {\n        const el = document.getElementById(l.id);\n        if (!el) return;\n        if (!l.steps.includes(currentStep)) { el.style.opacity = '0'; return; }\n\n        tempV.copy(l.getPos()); tempV.project(camera);\n        if (tempV.z > 1) { el.style.opacity = '0'; return; }\n\n        const x = (tempV.x * 0.5 + 0.5) * container.clientWidth;\n        const y = (-(tempV.y * 0.5) + 0.5) * container.clientHeight;\n        el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.opacity = '1';\n      });\n    }\n\n    /* 5. STATE & LOGIC */\n    const textContainer = document.getElementById('text-container');\n    const dotsContainer = document.getElementById('dots-container');\n    const btnPrev = document.getElementById('btn-prev');\n    const btnNext = document.getElementById('btn-next');\n\n    stepsData.forEach((s, idx) => {\n      const dot = document.createElement('div');\n      dot.className = `dot ${idx === 0 ? 'active' : ''}`;\n      dotsContainer.appendChild(dot);\n    });\n\n    function renderUI(stepIdx) {\n      const step = stepsData[stepIdx];\n      let boxClass = stepIdx === 0 ? 'over' : (stepIdx === 1 ? 'through' : (stepIdx === 2 ? 'up' : 'over'));\n\n      textContainer.innerHTML = `\n        <div class=\"step-badge\">${step.badge}<\/div>\n        <h2 class=\"step-title\">${step.name}<\/h2>\n        ${step.schemaDesc?`<div class=\"schema-card\"><strong>${step.schemaTitle}<\/strong>${step.schemaDesc}<\/div>`:''}\n        ${step.body?`<p class=\"explanation\">${step.body}<\/p>`:''}\n        <div class=\"example-box ${boxClass}\">\n          <div class=\"en\">💬 \"${step.example.en}\"<\/div>\n          <div class=\"vi\">${step.example.vi}<\/div>\n        <\/div>\n      `;\n\n      btnPrev.disabled = stepIdx === 0;\n      btnNext.innerHTML = stepIdx === stepsData.length - 1 ? 'Khám phá <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M12 5l7 7-7 7\"/><\/svg>' : 'Tiếp <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M12 5l7 7-7 7\"/><\/svg>';\n      \n      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === stepIdx));\n\n      targetCamPos.set(step.camPos.x, step.camPos.y, step.camPos.z);\n      targetLookAt.set(step.target.x, step.target.y, step.target.z);\n      isTransitioning = true;\n\n      sync3D(stepIdx);\n    }\n\n    function sync3D(step) {\n      overGroup.visible = false; throughGroup.visible = false; upGroup.visible = false;\n\n      // Centralize for individual views\n      overGroup.position.set(2, 0.1, 0);\n      throughGroup.position.set(2, 1.5, 0);\n      upGroup.position.set(2, 3.5, 0);\n\n      if (step === 0) {\n        overGroup.visible = true;\n        laserMat.color.setHex(0xfef08a); glowMat.color.setHex(0xeab308); // Vàng bao quát\n      } else if (step === 1) {\n        throughGroup.visible = true; \n        laserMat.color.setHex(0xa5f3fc); glowMat.color.setHex(0x06b6d4); // Xanh xuyên thấu\n        // Quay throughGroup ngang ra để dễ nhìn xuyên qua các trang\n        throughGroup.rotation.y = -Math.PI / 4; \n      } else if (step === 2) {\n        upGroup.visible = true;\n        laserMat.color.setHex(0xfbcfe8); glowMat.color.setHex(0xec4899); // Hồng tôn vinh\n      } else if (step === 3) {\n        // Tổng kết: Xếp 3 mô hình ra 3 hướng khác nhau\n        overGroup.visible = true; overGroup.position.copy(posOver);\n        \n        throughGroup.visible = true; throughGroup.position.copy(posThrough);\n        throughGroup.rotation.y = -Math.PI / 6; // Hướng mặt kính về phía tâm\n        \n        upGroup.visible = true; upGroup.position.copy(posUp);\n      }\n    }\n\n    btnNext.addEventListener('click', () => {\n      if (currentStep < stepsData.length - 1) { currentStep++; renderUI(currentStep); } \n      else { isTransitioning = false; }\n    });\n    btnPrev.addEventListener('click', () => {\n      if (currentStep > 0) { currentStep--; renderUI(currentStep); }\n    });\n    controls.addEventListener('start', () => { isTransitioning = false; });\n\n    /* 6. ANIMATION LOOP */\n    const clock = new THREE.Clock();\n    const currentLookTarget = new THREE.Vector3(5, 1.5, 0);\n\n    function animate() {\n      requestAnimationFrame(animate);\n      const elapsedTime = clock.getElapsedTime();\n\n      if (isTransitioning) {\n        camera.position.lerp(targetCamPos, 0.05);\n        controls.target.lerp(targetLookAt, 0.05);\n        controls.update();\n        if (camera.position.distanceTo(targetCamPos) < 0.1 && controls.target.distanceTo(targetLookAt) < 0.1) {\n          isTransitioning = false;\n        }\n      } else {\n        controls.update();\n      }\n\n      // --- Eye Tracking & Target Animations ---\n      let targetLookPos = new THREE.Vector3(5, 1.5, 0);\n\n      if (currentStep === 0) {\n        // OVER: Mắt quét qua lại ngang bề mặt Blueprint\n        const scanZ = Math.sin(elapsedTime * 2) * 1.2;\n        targetLookPos.set(overGroup.position.x, overGroup.position.y, overGroup.position.z + scanZ);\n        // Thanh scanner line chạy dọc theo\n        scannerLine.position.z = scanZ;\n      } \n      else if (currentStep === 1) {\n        // THROUGH: Mắt nhìn thẳng đâm xuyên qua core\n        secretCore.getWorldPosition(targetLookPos);\n        // Hiệu ứng các tấm kính/giấy dập dềnh nhẹ\n        pages.forEach((p, i) => {\n          p.position.y = Math.sin(elapsedTime * 2 + i) * 0.1;\n        });\n        secretCore.rotation.y += 0.05; secretCore.rotation.x += 0.02;\n      } \n      else if (currentStep === 2) {\n        // UP TO: Mắt ngước lên đỉnh tháp\n        starObj.getWorldPosition(targetLookPos);\n        // Tháp quyền lực xoay từ từ, hào quang mở rộng\n        starObj.rotation.y = elapsedTime * 0.5;\n        const scale = 1 + Math.sin(elapsedTime * 3) * 0.15;\n        halo.scale.set(scale, scale, scale);\n      } \n      else if (currentStep === 3) {\n        // SUMMARY: Mắt liên tục đảo qua 3 không gian\n        const cycle = (Math.sin(elapsedTime * 0.5) + 1) / 2;\n        if (cycle < 0.33) {\n          targetLookPos.copy(posOver); targetLookPos.y += 0.5; // Nhìn xuống\n          laserMat.color.setHex(0xfef08a); glowMat.color.setHex(0xeab308);\n        } else if (cycle < 0.66) {\n          targetLookPos.copy(posThrough); // Nhìn ngang\n          laserMat.color.setHex(0xa5f3fc); glowMat.color.setHex(0x06b6d4);\n        } else {\n          targetLookPos.copy(posUp); // Ngước lên\n          laserMat.color.setHex(0xfbcfe8); glowMat.color.setHex(0xec4899);\n        }\n        \n        // Vẫn giữ animation idle cho các vật thể\n        scannerLine.position.z = Math.sin(elapsedTime * 2) * 1.2;\n        starObj.rotation.y = elapsedTime * 0.5;\n        secretCore.rotation.y += 0.05;\n      }\n\n      currentLookTarget.lerp(targetLookPos, 0.1);\n      eyeball.lookAt(currentLookTarget);\n      observerGroup.position.y = 1.8 + Math.sin(elapsedTime * 2) * 0.05;\n\n      laserMat.opacity = 0.8 + Math.sin(elapsedTime * 15) * 0.2;\n      glowMat.opacity = 0.3 + Math.sin(elapsedTime * 15) * 0.2;\n\n      renderer.render(scene, camera);\n      updateLabels();\n    }\n\n    window.addEventListener('resize', () => {\n      const width = container.clientWidth; const height = container.clientHeight;\n      camera.aspect = width / height; camera.updateProjectionMatrix();\n      renderer.setSize(width, height);\n    });\n\n    renderUI(0);\n    animate();\n  <\/script>\n<\/body>\n<\/html>"</script>

<script type="application/json" id="src-sci">"<!DOCTYPE html>\n<html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Cụm động từ khoa học 3D<\/title>\n<style>\n:root{--bg:#f6f3ec;--sf:#fdfcf9;--sf2:#efe9dc;--tx:#2f3a4a;--mu:#6b7686;--bd:#e3dccd;--pr:#4f6bd8;color-scheme:light}\n*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif}\nbody{background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}\n.side{width:400px;min-width:340px;background:var(--sf);border-right:1px solid var(--bd);box-shadow:4px 0 24px rgba(70,60,40,.07);display:flex;flex-direction:column;z-index:2}\n.hd{padding:18px 22px;border-bottom:1px solid var(--bd)}\n.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:20px;background:rgba(79,107,216,.12);color:#3f5fb8;border:1px solid rgba(79,107,216,.25);margin-bottom:8px}\nh1{font-size:1.15rem;font-weight:800;line-height:1.3}\n.body{flex:1;padding:18px 22px;overflow-y:auto}\n.badge{font-size:.82rem;font-weight:600;color:var(--mu);margin-bottom:8px}\n.st{font-size:1.25rem;font-weight:700;margin-bottom:12px;line-height:1.3}\n.card{background:rgba(47,58,74,.05);border-left:4px solid var(--c,#4f6bd8);padding:10px 14px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:.92rem;color:#4b5563;line-height:1.55}\n.card b{display:block;color:var(--tx);margin-bottom:2px}\n.ex{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--c,#4f6bd8);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(70,60,40,.08)}\n.ex .en{font-weight:600;color:var(--tx)}.ex .vi{font-size:.86rem;color:var(--mu);margin-top:2px}\n.ctl{padding:14px 22px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}\nbutton{padding:9px 16px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--sf2);color:var(--tx)}\nbutton:hover:not(:disabled){background:#e6dfd0;border-color:#cfc6b3}button:disabled{opacity:.35;cursor:not-allowed}\nbutton.pr{background:var(--pr);border-color:var(--pr);color:#fff;box-shadow:0 2px 8px rgba(79,107,216,.28)}\nbutton.pr:hover:not(:disabled){background:#425cc4}\nbutton:focus-visible{outline:2px solid #2f8fbf;outline-offset:2px}\n.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#cfc7b6;cursor:pointer;transition:.3s}.dot.on{width:24px;border-radius:4px;background:var(--pr)}\n.vp{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at center,#f4f1ea,#e2ddd0)}\ncanvas{position:absolute;inset:0;display:block}\n.ann{position:absolute;inset:0;pointer-events:none}\n.lb{position:absolute;transform:translate(-50%,-120%);background:rgba(255,255,255,.94);border:1px solid rgba(47,58,74,.12);box-shadow:0 4px 14px rgba(70,60,40,.14);padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s}\n.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:.74rem;color:var(--mu);white-space:nowrap;pointer-events:none}\n@media(max-width:768px){body{flex-direction:column-reverse}.side{width:100%;min-width:0;height:46vh;border-right:0;border-top:1px solid var(--bd)}.vp{height:54vh;flex:none}.hint{display:none}}\n.tools{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}\n.tools label,.tools button{background:rgba(255,255,255,.88);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:.78rem;font-weight:600;color:var(--tx);cursor:pointer}\n.tools .hint{position:static;transform:none;background:none;font-size:.72rem}\n.scrub{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;z-index:3}\n.scrub button{padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.9)}\n.scrub input{flex:1;accent-color:var(--pr)}\n.lb{transform:translate(-50%,calc(-100% - 24px))}\n.lb::after{content:\"\";position:absolute;left:50%;top:100%;width:2px;height:22px;margin-left:-1px;background:rgba(47,58,74,.38)}\n.lb::before{content:\"\";position:absolute;left:50%;top:calc(100% + 20px);width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(47,58,74,.7)}\n@media(max-width:768px){.tools .hint{display:none}}\n<\/style><\/head>\n<body>\n<div class=\"side\">\n<div class=\"hd\"><span class=\"tag\">Cụm động từ khoa học<\/span><h1>Từ phản ứng hạt nhân đến xà phòng<\/h1><\/div>\n<div class=\"body\"><div class=\"badge\" id=\"bd\"><\/div><h2 class=\"st\" id=\"st\"><\/h2><div class=\"card\" id=\"cd\"><\/div><div class=\"ex\" id=\"ex\"><\/div><div class=\"card\" id=\"nt\" style=\"--c:#f59e0b\"><\/div><\/div>\n<div class=\"ctl\"><button id=\"pv\">❮ Lùi<\/button><div class=\"dots\" id=\"dots\"><\/div><button id=\"rp\" title=\"Chạy lại (Space)\">↻<\/button><button class=\"pr\" id=\"nx\">Tiếp ❯<\/button><\/div>\n<\/div>\n<div class=\"vp\" id=\"vp\"><div class=\"ann\" id=\"an\"><\/div><div class=\"tools\"><label><input type=\"checkbox\" id=\"tgl\" checked> Nhãn<\/label><button id=\"qb\" type=\"button\">Đồ họa: Cao<\/button><span class=\"hint\">Kéo để xoay · cuộn để phóng to<\/span><\/div><div class=\"scrub\"><button id=\"pb\" type=\"button\" aria-label=\"Tạm dừng hoặc chạy\">⏸<\/button><input id=\"sl\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Tua cảnh\"><\/div><\/div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n<script>\nconst S=[{\"c\": \"#60a5fa\", \"hl\": \"takes in\", \"t\": \"1. TAKE IN: hút vào bên trong\", \"img\": \"\", \"en\": \"The nucleus takes in a slow neutron.\", \"vi\": \"Hạt nhân hút vào (hấp thụ) một nơ-tron <script type="application/json" id="src-psy">"<!DOCTYPE html>\n<html lang=\"vi\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Tâm lý 3D<\/title>\n<style>\n:root{--bg:#f6f3ec;--sf:#fdfcf9;--sf2:#efe9dc;--tx:#2f3a4a;--mu:#6b7686;--bd:#e3dccd;--pr:#4f6bd8;color-scheme:light}\n*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif}\nbody{background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}\n.side{width:400px;min-width:340px;background:var(--sf);border-right:1px solid var(--bd);box-shadow:4px 0 24px rgba(70,60,40,.07);display:flex;flex-direction:column;z-index:2}\n.hd{padding:18px 22px;border-bottom:1px solid var(--bd)}\n.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:20px;background:rgba(79,107,216,.12);color:#3f5fb8;border:1px solid rgba(79,107,216,.25);margin-bottom:8px}\nh1{font-size:1.15rem;font-weight:800;line-height:1.3}\n.body{flex:1;padding:18px 22px;overflow-y:auto}\n.badge{font-size:.82rem;font-weight:600;color:var(--mu);margin-bottom:8px}\n.st{font-size:1.25rem;font-weight:700;margin-bottom:12px;line-height:1.3}\n.card{background:rgba(47,58,74,.05);border-left:4px solid var(--c,#4f6bd8);padding:10px 14px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:.92rem;color:#4b5563;line-height:1.55}\n.card b{display:block;color:var(--tx);margin-bottom:2px}\n.ex{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--c,#4f6bd8);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(70,60,40,.08)}\n.ex .en{font-weight:600;color:var(--tx)}.ex .vi{font-size:.86rem;color:var(--mu);margin-top:2px}\n.ctl{padding:14px 22px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}\nbutton{padding:9px 16px;border-radius:8px;font-size:.9rem
