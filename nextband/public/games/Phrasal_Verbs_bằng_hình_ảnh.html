<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrasal Verbs bằng hình ảnh</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe1ea;--accent:#6366f1;--accent2:#0ea5e9;--ok:#16a34a;--warn:#d97706;--warnbg:#fef3c7;--okbg:#dcfce7;--sel:#e0e7ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--accent:#818cf8;--accent2:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--warnbg:#422006;--okbg:#14532d;--sel:#312e81;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--accent:#818cf8;--accent2:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--warnbg:#422006;--okbg:#14532d;--sel:#312e81;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 20px 8px;max-width:1200px;margin:auto}
h1{margin:0;font-size:1.5rem}
.sub{color:var(--muted);margin:2px 0 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;max-width:1200px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav button .ck{color:var(--ok);margin-left:4px}
nav button.on .ck{color:#fff}
main{max-width:1200px;margin:auto;padding:0 20px 40px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.steps .card b{display:block;font-size:1.05rem;margin-bottom:4px}
.big{font-size:1.1rem}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar p{margin:0;color:var(--muted);flex:1 1 280px}
iframe{width:100%;height:max(560px,78vh);border:1px solid var(--line);border-radius:14px;background:#f2eee5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fc{min-height:112px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer}
.fc .tag{font-size:.75rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em}
.fc .en{font-size:1.15rem;font-weight:600;margin:4px 0}
.fc .vi{display:none;color:var(--ok)}
.fc.open .vi{display:block}
.fc .hint{color:var(--muted);font-size:.82rem}
.fc.open .hint{display:none}
/* ===== Luyện tập ===== */
.ex{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.exh{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.exh h2{margin:0;font-size:1.25rem}
.exh .chips{margin:0}
.extabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.extabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-size:.92rem;cursor:pointer}
.extabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.exi{color:var(--muted);margin:8px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:44px}
.pc{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;cursor:grab;touch-action:manipulation}
.pc.sel{outline:2px solid var(--accent);background:var(--sel)}
.pc.pulse{animation:pls 1.1s ease-in-out infinite;border-color:var(--accent2)}
@keyframes pls{50%{box-shadow:0 0 0 5px var(--accent2)}}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.slot,.grp{border:2px dashed var(--line);border-radius:14px;padding:14px;background:var(--card);cursor:pointer}
.slot.over,.grp.over,.blank.over{border-color:var(--accent);background:var(--sel)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.no,.blank.no,.grp.no{border-color:var(--warn);background:var(--warnbg)}
.slot.hl,.blank.hl,.grp.hl{border-color:var(--accent2);border-style:solid}
.se{font-size:2rem;line-height:1.2}
.st{margin:4px 0}
.sv{font-weight:600;color:var(--accent)}
.slot.ok .sv{color:var(--text)}
.sents{padding-left:24px;display:grid;gap:16px;font-size:1.05rem}
.blank{display:inline-block;min-width:80px;text-align:center;border:2px dashed var(--line);border-radius:8px;padding:0 10px;margin:0 4px;cursor:pointer;font-weight:600;color:var(--accent)}
.blank.ok{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--text)}
.sents .vi{color:var(--muted);font-size:.92rem}
.nt{margin-top:4px;padding:8px 12px;border-radius:10px;background:var(--warnbg);font-size:.9rem}
.grp small{display:block;color:var(--muted);margin-bottom:2px}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gl .pc{cursor:default;padding:4px 10px;font-size:.9rem;border-color:var(--ok);background:var(--okbg)}
.fb{margin:12px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.fb.ok{border-color:var(--ok);background:var(--okbg);color:var(--text)}
.fb.no{border-color:var(--warn);background:var(--warnbg);color:var(--text)}
.fb.hint{border-color:var(--accent2);color:var(--text)}
.exbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn[disabled]{opacity:.5;cursor:default}
.dq{margin:12px 0}
.dq textarea{display:block;width:100%;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.cmp{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line)}
.cmp fieldset{border:1px solid var(--line);border-radius:10px;margin:8px 0}
.cmp label{display:block;margin:4px 0}
.tip{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.ex :focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pc.pulse{animation:none;outline:3px solid var(--accent2)}}
.gq{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.gq .en{font-size:1.6rem;font-weight:700;margin:4px 0}
.gopts{display:grid;gap:10px;margin:12px 0}
.gopts .pc{text-align:left;cursor:pointer}
.gopts .pc.ok{border-color:var(--ok);background:var(--okbg)}
.gopts .pc.no{border-color:var(--warn);background:var(--warnbg);opacity:.7}
.stamps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stp{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;color:var(--muted)}
.stp.ok{border-color:var(--ok);background:var(--okbg);color:var(--text)}
/* ===== GIAO DIỆN V2: 3 tầng thị giác. Tầng 1 = hero + khung bài học (duy nhất có bóng đổ). Tầng 2 = tiêu đề, lời dẫn lớn. Tầng 3 = điều khiển nhỏ, thẻ phẳng. ===== */
:root{--bg:#f6f3ec;--card:#fdfcf9;--text:#2f3a4a;--muted:#6b7686;--line:#e3dccd;--accent:#4f6bd8;--accent2:#2f8fbf;--ok:#2f8f62;--okbg:#e0f0e4;--warn:#a8691a;--warnbg:#f9ecd0;--sel:#e3e8f8;--ink:#46566e;--inkfg:#f7f4ee;--tint:#efe9dc;--onaccent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#121d31;--text:#eaf0fb;--muted:#93a4c0;--line:#243452;--accent:#8aa0ff;--accent2:#4cc2ff;--ok:#4bd39b;--okbg:#0f3a2b;--warn:#ffc857;--warnbg:#3b2a08;--sel:#1c2b57;--ink:#0f1b33;--inkfg:#eaf0fb;--tint:#17253f;--onaccent:#0a1220}}
:root[data-theme="dark"]{--bg:#0a1220;--card:#121d31;--text:#eaf0fb;--muted:#93a4c0;--line:#243452;--accent:#8aa0ff;--accent2:#4cc2ff;--ok:#4bd39b;--okbg:#0f3a2b;--warn:#ffc857;--warnbg:#3b2a08;--sel:#1c2b57;--ink:#0f1b33;--inkfg:#eaf0fb;--tint:#17253f;--onaccent:#0a1220}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.hero{max-width:none;margin:0;padding:clamp(28px,6vw,60px) 0 30px;background:var(--ink);color:var(--inkfg)}
.hw{max-width:1160px;margin:auto;padding:0 20px}
.hero h1{font-size:clamp(2.2rem,6.5vw,4.4rem);line-height:1.02;font-weight:800;letter-spacing:-.035em;max-width:13ch}
.hero .sub{color:var(--inkfg);opacity:.78;font-size:1.15rem;max-width:46ch;margin:14px 0 0}
.hp{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hp button{font-family:inherit;font-weight:800;font-size:1.15rem;line-height:1;letter-spacing:-.01em;padding:13px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:transparent;color:inherit;cursor:pointer}
.hp button:hover{background:var(--inkfg);color:var(--ink)}
.hprog{margin:18px 0 0;opacity:.7;font-size:.95rem}
nav{position:sticky;top:0;z-index:20;max-width:none;margin:0;padding:10px max(20px,calc((100vw - 1160px)/2 + 20px));background:var(--bg);border-bottom:1px solid var(--line)}
nav button{position:relative;border:0;background:transparent;color:var(--muted);font-weight:600;border-radius:10px}
nav button.on{background:var(--ink);color:var(--inkfg)}
nav button.on .ck{color:var(--inkfg)}
nav button[data-id=map]{margin-left:18px}
nav button[data-id=map]::before{content:"";position:absolute;left:-11px;top:22%;bottom:22%;width:1px;background:var(--line)}
main{max-width:1160px;padding-top:30px}
.big{font-size:1.2rem}
.btn{color:var(--onaccent);font-weight:600}.btn.ghost{color:var(--text)}
.bar{align-items:flex-start;gap:12px;margin-bottom:18px}
.bar p{flex:1 1 360px;font-size:1.2rem;line-height:1.5;color:var(--text);max-width:60ch}
.bar .btn{padding:8px 14px;font-size:.9rem}.bar .btn:not(.ghost){padding:10px 18px;font-size:1rem}
iframe{border:0;border-radius:18px;box-shadow:0 26px 50px -30px rgba(70,60,40,.22)}
#p-start>.card{border:0;background:transparent;padding:0}
#p-start .big{font-size:1.5rem;font-weight:500;line-height:1.45;max-width:46ch}
.steps .card{border:0;background:var(--tint);border-radius:16px}
.steps .card b{font-size:1.2rem;letter-spacing:-.01em}
.chips button.on,.extabs button.on{background:var(--ink);border-color:var(--ink);color:var(--inkfg)}
.extabs button{border:0;background:var(--tint);font-weight:600}
.fc{border:0;background:var(--tint)}
.fc .tag{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}
.fc .en{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.fc.open{background:var(--okbg)}.fc .vi{color:var(--text);font-weight:500}
#p-map>.card:first-child{border:0;background:var(--tint)}
#mb>.card{border:0;background:transparent;padding:8px 0}
#mb h2{font-size:clamp(2.4rem,7vw,4rem);letter-spacing:-.04em;line-height:1}
#mb h3{font-size:1.1rem;margin:24px 0 8px}
.ex{border-top:0;margin-top:56px}
.exh h2{font-size:1.8rem;letter-spacing:-.025em}
.slot,.grp{background:var(--tint)}
.gq{border:0;background:var(--tint);padding:24px}
.gq .en{font-size:2.3rem;font-weight:800;letter-spacing:-.025em}
.gopts .pc{padding:14px 18px;font-weight:600}
.stp{border:0;background:var(--tint)}.stp.ok{background:var(--okbg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on,:root:not([data-theme="light"]) .chips button.on,:root:not([data-theme="light"]) .extabs button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}:root:not([data-theme="light"]) nav button.on .ck{color:var(--onaccent)}}
:root[data-theme="dark"] nav button.on,:root[data-theme="dark"] .chips button.on,:root[data-theme="dark"] .extabs button.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}

/* Chế độ tập trung: vào bài học thì ẩn phần đầu trang, chỉ "Bắt đầu" mới hiện tựa đề */
body.focus .hero{display:none}
body.focus iframe{height:max(560px,calc(100vh - 170px))}

/* Lộ trình và nhóm chặng */
#nav .ng{flex:none;align-self:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 10px;white-space:nowrap}
.lvl{color:var(--accent);margin-right:4px}
#path .stage{margin:10px 0}
#path .stage .sub{margin:4px 0 8px}

/* Ôn bài */
.rvo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.rvo button{padding:12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.rvo button:hover:not(:disabled){border-color:var(--accent)}.rvo button:disabled{cursor:default}
.rvo button.ok{border-color:var(--ok);background:var(--okbg)}.rvo button.no{border-color:var(--warn);background:var(--warnbg)}
.rvi{width:100%;max-width:340px;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--text);margin-right:8px}
.blank{border-bottom:2px solid var(--accent);padding:0 6px;color:var(--accent)}
.okm{color:var(--ok)}.nom{color:var(--warn)}
.rvl{display:grid;gap:10px;margin:14px 0}
.rvl button{text-align:left;padding:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font:inherit;cursor:pointer}
.rvl button:hover:not(:disabled){border-color:var(--accent)}.rvl button:disabled{cursor:default}
.rvl button.ok{border-color:var(--ok);background:var(--okbg)}.rvl button.no{border-color:var(--warn);background:var(--warnbg)}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.45}
.bub.a{align-self:flex-start;background:var(--tint);border-bottom-left-radius:4px}
.bub.b{align-self:flex-end;background:var(--sel);border-bottom-right-radius:4px}
.spk{border:0;background:none;cursor:pointer;font-size:1rem;margin-left:6px;padding:0 2px}
.pass{background:var(--tint);padding:12px 14px;border-radius:12px;line-height:1.8;margin:10px 0}
.pass b{color:var(--accent)}
.pass b.cur,.big b.cur{background:var(--sel);padding:0 5px;border-radius:6px;box-shadow:inset 0 -2px var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header class="hero"><div class="hw"><h1>Phrasal Verbs bằng hình ảnh</h1><p class="sub">Mỗi hạt từ là một hình ảnh. Nhìn hình, đoán nghĩa.</p><div class="hp" id="hp" role="group" aria-label="Chọn một hạt từ để bắt đầu"></div><p class="hprog" id="hprog"></p></div></header>
<nav id="nav" aria-label="Bài học"></nav>
<main id="main"></main>

<script>
/* ===== DỮ LIỆU: chỉnh ở đây để bổ sung bài và từ vựng ===== */
// Mỗi bài: id trùng với khối <script id="src-ID"> ở cuối file (chứa nguyên file HTML của bài)

function getS(lid,t){
  const e=ES[lid]||(ES[lid]={tab:"A"});
  let s=e[t];
  if(!s||s.lv!==level){
    const d=EX[lid][t];
    s={lv:level,placed:{},done:false,sel:null,hl:null,fb:null,flash:null,d:{}};
    if(t==="A"){s.items=d.scenes.filter(x=>x.lv<=level);s.bank=shuffle([...s.items.map(x=>x.a),...d.extra])}
    if(t==="B"){s.items=d.items.filter(x=>x.lv<=level);s.bank=shuffle(d.chips)}
    if(t==="C"){s.items=d.items;s.bank=shuffle(d.items.map((x,i)=>String(i)))}
    e[t]=s;
  }
  return s;
}

function renderEx(lid,root){
  const e=ES[lid]||(ES[lid]={tab:"A"});
  if(!TYPES.some(t=>t[0]===e.tab&&t[2]<=level))e.tab="A";
  const t=e.tab,s=getS(lid,t);
  root.dataset.lesson=lid;
  const tabs=TYPES.filter(x=>x[2]<=level).map(x=>`<button role="tab" aria-selected="${x[0]===t}" class="${x[0]===t?"on":""}" data-tab="${x[0]}">${x[0]}. ${x[1]}${getS(lid,x[0]).done?' <span aria-hidden="true">✓</span>':""}</button>`).join("");
  const lvs=[[2,"Cấp 2 (THCS)"],[3,"Cấp 3 (THPT)"]].map(([v,n])=>`<button data-lv="${v}" class="${v===level?"on":""}">${n}</button>`).join("");

  if(focusKey){const el=root.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);if(el)el.focus();focusKey=null}
  if(!root._w)wire(root);
}

function bodyP(lid,t,s){

  const bank=s.bank.filter(id=>!used.has(id)).map(id=>chip(id,t==="C"?d.items[id].en:id)).join("");
  let targets="";

function attempt(L,id,i){
  const e=ES[L],t=e.tab,s=getS(L,t),d=EX[L][t];
  s.sel=null;s.hl=null;s.flash=null;
  const tag=lessonTitle(L)+" · "+TYPES.find(x=>x[0]===t)[1];
  let ok,m,key,rec,tk;
  if(t==="A"){const it=s.items[i];if(s.placed[i]!=null)return;
    ok=it.a===id;key=L+"|A|"+it.a;rec={en:it.a,vi:it.vi,lesson:L,tag};tk="s:"+i;
    if(ok){s.placed[i]=id;m="Đúng rồi: "+it.a+" nghĩa là "+it.vi+"."}else m="Chưa khớp. Nhìn lại hình ảnh: "+it.cue}
  else if(t==="B"){const it=s.items[i];if(s.placed[i]!=null)return;
    const full=it.s.replace("___",it.a);ok=it.a===id;key=L+"|B|"+full;rec={en:full,vi:it.vi,lesson:L,tag};tk="b:"+i;
    if(ok){s.placed[i]=id;m="Đúng rồi: "+full}else m="Chưa khớp. Nhìn lại hình ảnh: "+it.cue}
  else{const it=d.items[id];if(it==null||s.placed[id]!=null)return;
    ok=it.g===+i;key=L+"|C|"+it.en;rec={en:it.en,vi:it.vi,lesson:L,tag};tk="g:"+i;
    if(ok){s.placed[id]=String(i);m="Đúng nhóm “"+d.groups[i][0]+"”: "+it.vi}else m="Chưa khớp. Nhìn lại hình ảnh: "+it.cue}
  if(ok){if(MISS[key]){delete MISS[key];saveMiss()}}else{MISS[key]=rec;saveMiss();s.flash=tk}
  s.fb={c:ok?"ok":"no",m};
  if(ok&&Object.keys(s.placed).length===s.items.length){s.done=true;s.fb.m+=" Bạn đã hoàn thành! Có thể làm lại bất cứ lúc nào."}
  focusKey=tk;
}

function doHint(L){
  const e=ES[L],t=e.tab,s=getS(L,t),d=EX[L][t];
  let cue,tgt,ans;
  if(t==="A"||t==="B"){const i=s.items.findIndex((x,k)=>s.placed[k]==null);if(i<0)return;
    const it=s.items[i];cue=it.cue;tgt=(t==="A"?"s:":"b:")+i;ans="c:"+it.a}
  else{const id=s.bank.find(x=>s.placed[x]==null);if(id==null)return;
    const it=d.items[id];cue=it.cue;tgt="c:"+id;ans="g:"+it.g}
  const again=s.hl&&s.hl.key===tgt;
  s.sel=null;s.flash=null;s.hl={key:tgt,target:tgt,answer:again?ans:null};
  s.fb={c:"hint",m:again?"Gợi ý: xem lựa chọn được tô sáng.":"Gợi ý: "+cue};
}

function wire(root){
  root._w=1;
  const L=()=>root.dataset.lesson, S=()=>getS(L(),ES[L()].tab), redraw=()=>renderEx(L(),root);
  root.addEventListener("click",ev=>{
    const e=ES[L()],tg=ev.target;
    const lv=tg.closest("[data-lv]");
    if(lv){level=+lv.dataset.lv;try{localStorage.setItem("pv-level",level)}catch(x){}
      document.querySelectorAll(".ex").forEach(r=>renderEx(r.dataset.lesson,r));return}
    const tb=tg.closest("[data-tab]");if(tb){e.tab=tb.dataset.tab;redraw();return}
    const act=tg.closest("[data-act]");
    if(act){if(act.dataset.act==="hint")doHint(L());else{delete e[e.tab]}redraw();return}
    const cm=tg.closest("[data-cmp]");
    if(cm){const s=S();dq(s,+cm.dataset.cmp).shown=true;s.done=EX[L()].D.prompts.every((p,k)=>dq(s,k).shown);focusKey=null;redraw();return}
    if(e.tab==="D")return;
    const ch=tg.closest(".bank .pc");
    if(ch){const s=S();s.sel=s.sel===ch.dataset.id?null:ch.dataset.id;s.hl=null;focusKey="c:"+ch.dataset.id;redraw();return}
    const tgt=tg.closest("[data-i]");
    if(tgt){const s=S();
      if(s.sel!=null)attempt(L(),s.sel,tgt.dataset.i);
      else{s.fb={c:"hint",m:"Hãy chọn một lựa chọn ở phía trên trước, rồi bấm vào ô này."};focusKey=tgt.dataset.k}
      redraw()}
  });
  root.addEventListener("keydown",ev=>{
    if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("div[role=button],span[role=button]")){ev.preventDefault();ev.target.click()}
    if(ev.key==="Escape"&&ES[L()].tab!=="D"){const s=S();if(s.sel!=null){s.sel=null;redraw()}}
  });
  root.addEventListener("input",ev=>{
    const x=ev.target;if(x.matches("textarea[data-d]"))dq(S(),+x.dataset.d).text=x.value});
  root.addEventListener("change",ev=>{
    const x=ev.target;if(x.matches("input[data-ck]"))dq(S(),+x.dataset.d).ck[+x.dataset.ck]=x.checked});
  root.addEventListener("dragstart",ev=>{
    const c=ev.target.closest&&ev.target.closest(".bank .pc");
    if(c){dragId=c.dataset.id;ev.dataTransfer.setData("text/plain",dragId);ev.dataTransfer.effectAllowed="move"}});
  root.addEventListener("dragend",()=>{dragId=null;root.querySelectorAll(".over").forEach(n=>n.classList.remove("over"))});
  root.addEventListener("dragover",ev=>{
    const t=ev.target.closest("[data-i]");if(t&&dragId!=null){ev.preventDefault();t.classList.add("over")}});
  root.addEventListener("dragleave",ev=>{const t=ev.target.closest("[data-i]");if(t)t.classList.remove("over")});
  root.addEventListener("drop",ev=>{
    const t=ev.target.closest("[data-i]");if(!t||dragId==null)return;
    ev.preventDefault();attempt(L(),dragId,t.dataset.i);dragId=null;redraw()});
}

function buildGame(){
  const p=$("#p-game");heroUpdate();if(!G){G={mode:"g1",q:null};nextQ()}
  if(G.mode==="g3"&&G.b)return buildGame3(p);
  const q=G.q,g1=G.mode==="g1",right=g1?q.x.p.toLowerCase():q.x.img;
  const stamps=SCH.map(x=>{const n=Math.min(STAMPS[x.p]||0,5);return `<span class="stp${n>=5?" ok":""}">${x.p} ${"●".repeat(n)}${"○".repeat(5-n)}</span>`}).join("");
  p.innerHTML=`<div class="card"><p class="big"><b>Phòng game.</b> Mỗi câu đúng thêm một chấm. Đủ 5 chấm nhận dấu hạt từ.</p>
  <div class="chips">${[["g1","Đoán hạt từ"],["g2","Hình nào giải thích?"],["g3","Gõ cụm vào câu"]].map(([m,n])=>`<button data-m="${m}" class="${G.mode===m?"on":""}">${n}</button>`).join("")}</div>
  <div class="stamps">${stamps}</div>
  <div class="gq"><div class="tag">${g1?"Điền hạt từ còn thiếu":"Chọn hình ảnh phù hợp với nghĩa"}</div>
  <div class="en">${g1?esc(q.en.split(" ")[0])+" ___":esc(q.en)}</div><div>Nghĩa: ${esc(q.vi)}</div>
  <div class="gopts">${G.opts.map(o=>`<button class="pc${G.bad.includes(o)?" no":""}${G.done&&o===right?" ok":""}" data-o="${esc(o)}"${G.done?" disabled":""}>${esc(o)}</button>`).join("")}</div>
  <div class="fb${G.msg?(G.done?" ok":" no"):""}" role="status" aria-live="polite">${esc(G.msg||(g1?"Đọc nghĩa, chọn hạt từ đúng.":"Nghĩa này gợi hình ảnh nào của hạt từ?"))}</div>
  <button class="btn" data-n>${G.done?"Câu tiếp →":"Đổi câu khác"}</button></div></div>`;
  p.querySelector(".chips").after(lvBar(()=>{nextQ();buildGame()}));
  p.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{G.mode=b.dataset.m;nextQ();buildGame()});
  p.querySelector("[data-n]").onclick=()=>{nextQ();buildGame()};
  p.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(G.done)return;const o=b.dataset.o;
    if(o===right){G.done=true;const before=STAMPS[q.x.p]||0;STAMPS[q.x.p]=before+1;try{localStorage.setItem("pv-stamps",JSON.stringify(STAMPS))}catch(e){}
      G.msg=`Đúng! ${q.en} = ${q.vi}. Hạt ${q.x.p}: ${q.x.img} (tầng: ${q.l}).`+(before===4?` 🎉 Bạn nhận được dấu ${q.x.p}!`:"")}
    else{G.bad.push(o);G.msg=g1?"Chưa khớp. Nghĩ lại hình ảnh này: "+q.x.img:`Chưa khớp. Nghĩa “${q.vi}” thuộc tầng ${q.l}: thử nghĩ từ nghĩa vật lý đi dần sang nghĩa trừu tượng.`}
    buildGame()});
}

function pathRender(){
  const el=$("#path");if(!el)return;
  const nx=LESSONS.find(l=>!done[l.id]),any=LESSONS.some(l=>done[l.id]);
  el.innerHTML=STAGES.map(st=>`<div class="card stage"><b>Chặng ${st.n} · ${esc(st.title)}</b><p class="sub">${esc(st.sub)}</p><div class="chips">${LESSONS.filter(l=>l.stage===st.n).map(l=>`<button data-go="${l.id}"${nx&&nx.id===l.id?' class="on"':''}>${LESSONS.indexOf(l)+1}. ${esc(l.short)} · ${esc(l.lv)}${done[l.id]?" ✓":""}</button>`).join("")}${st.n===5?'<button data-go="talk">Hội thoại · Khá</button><button data-go="rw">Đọc và viết · Nâng cao</button>':''}</div></div>`).join("")
   +`<div class="card stage"><b>Ôn luyện và tra cứu</b><p class="sub">Sau mỗi chặng: Ôn bài, rồi chơi game.</p><div class="chips"><button data-go="review">Ôn bài</button><button data-go="game">Phòng game</button><button data-go="map">Bản đồ hình ảnh</button><button data-go="vocab">Từ vựng</button></div></div>`;
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
  const g=$("#go1");if(g)g.textContent=nx?(any?"Tiếp tục: bài "+(LESSONS.indexOf(nx)+1)+" · "+nx.short+" →":"Bắt đầu với bài 1: "+nx.short+" →"):"Ôn luyện với Phòng game →";
}
function heroUpdate(){pathRender();const e=$("#hprog");if(e)e.textContent=`Đã học ${Object.values(done).filter(Boolean).length}/${LESSONS.length} bài · ${SCH.filter(x=>(STAMPS[x.p]||0)>=5).length}/${SCH.length} dấu hạt từ`}
function heroInit(){
  const hp=$("#hp"),items=SCH.map((x,i)=>[x.p,i]);
  items.forEach(([p,i])=>{const b=document.createElement("button");b.textContent=p;b.onclick=()=>{if(p==="OFF")show("off");else{mi=i;buildMap();show("map")}};hp.appendChild(b)});
  heroUpdate();
}

function build(){
  nav.innerHTML="";main.innerHTML="";
  let lg="";
  TABS.forEach((t,i)=>{
    const gr=LESSONS.some(l=>l.id===t.id)?"Chặng "+t.stage:((t.id==="talk"||t.id==="rw")?"Chặng 5":(t.id==="start"?"":"Ôn luyện"));
    if(gr&&gr!==lg){lg=gr;nav.insertAdjacentHTML("beforeend",`<span class="ng">${gr}</span>`)}
    const b=document.createElement("button");b.dataset.id=t.id;
    b.innerHTML=(LESSONS.some(l=>l.id===t.id)?(LESSONS.findIndex(l=>l.id===t.id)+1)+". ":"")+esc(t.short||t.title)+(done[t.id]?'<span class="ck">✓</span>':"");
    b.onclick=()=>show(t.id);nav.appendChild(b);
    const p=document.createElement("section");p.className="panel";p.id="p-"+t.id;main.appendChild(p);
  });
  $("#p-start").innerHTML=`<div class="card"><p class="big"><b>Ý tưởng chính:</b> mỗi cụm bắt đầu từ một hình ảnh. Nhìn hình, đoán nghĩa.</p>
  <div class="steps"><div class="card"><b>1. Nhìn</b>Xem hình ảnh chuyển động và đọc ví dụ.</div><div class="card"><b>2. Đoán</b>Nhìn hình, đoán nghĩa trước.</div><div class="card"><b>3. Đặt câu</b>Dùng cụm vừa học để nói về chính bạn.</div></div>
  <p class="sub">Gặp cụm lạ, hãy tra từ điển.</p>
  <p class="sub"><b>Lộ trình gợi ý:</b> học lần lượt từng chặng, rồi ôn.</p><div id="path"></div><p><button class="btn" id="go1"></button></p></div>`;
  $("#go1").onclick=()=>show((LESSONS.find(l=>!done[l.id])||{id:"game"}).id);
  LESSONS.forEach((l,i)=>{
    const nx=LESSONS[i+1],end=!nx||nx.stage!==l.stage;
    $("#p-"+l.id).innerHTML=`<div class="bar"><p><b class="lvl">Chặng ${l.stage} · ${esc(l.lv)}</b> Kéo chuột để xoay 3D.</p>
    <button class="btn ghost" data-ex>Luyện tập ↓</button>
    <button class="btn ghost" data-fs>⛶ Toàn màn hình</button>
    <button class="btn ghost" data-done>${done[l.id]?"✓ Đã học":"Đánh dấu đã học"}</button>
    <button class="btn" data-next>${end?"Ôn chặng "+l.stage+" →":"Bài tiếp: "+esc(nx.short||nx.title)+" →"}</button></div><iframe title="${esc(l.title)}" allow="fullscreen" allowfullscreen></iframe><section class="ex" aria-label="Luyện tập" data-lesson="${l.id}"></section>`;
    const p=$("#p-"+l.id);
    renderEx(l.id,$(".ex",p));
    $("[data-ex]",p).onclick=()=>$(".ex",p).scrollIntoView({block:"start"});
    $("[data-fs]",p).onclick=()=>{const f=$("iframe",p);(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
    $("[data-done]",p).onclick=ev=>{done[l.id]=!done[l.id];save();ev.currentTarget.textContent=done[l.id]?"✓ Đã học":"Đánh dấu đã học";const nb=nav.querySelector('[data-id="'+l.id+'"]'),ck=nb.querySelector(".ck");if(done[l.id]&&!ck)nb.insertAdjacentHTML("beforeend",'<span class="ck">✓</span>');if(!done[l.id]&&ck)ck.remove();heroUpdate()};
    $("[data-next]",p).onclick=()=>{if(end){RV.stage=String(l.stage);RV.phase="start";buildReview();show("review")}else show(nx.id)};
  });
  buildMap();buildGame();buildVocab();buildReview();buildTalk();buildRW();
}

const TALK=[{"id": "t1", "e": "☕", "title": "Rủ đi chơi", "turns": [{"a": "I’m free on Saturday. Wanna do something?", "b": "Sure! Let’s ___ at the café.", "o": ["hang out", "hold on", "call off"], "c": 0, "vi": "Được! Mình đi cà phê tụ tập nhé.", "why": "Hang out = đi chơi, tụ tập.", "tip": ""}, {"a": "Cool. I haven’t seen you for ages!", "b": "I know! We need to ___ on everything.", "o": ["catch up", "back up", "pick up"], "c": 0, "vi": "Mình biết! Phải kể nhau nghe mọi chuyện chứ.", "why": "Catch up = cập nhật chuyện của nhau.", "tip": ""}, {"a": "Do you want me to come to your house first?", "b": "No, I’ll pick you ___ at nine near the bus stop.", "o": ["up", "out", "off"], "c": 0, "vi": "Không, mình sẽ đón bạn lúc chín giờ gần trạm xe buýt.", "why": "Pick you up = đón bạn.", "tip": "Nói: pick you UP, nhấn vào “up”."}, {"a": "Awesome. Bring your sister too!", "b": "I can’t. She’s ___ a cold.", "o": ["coming down with", "going out with", "falling over with"], "c": 0, "vi": "Không được. Em ấy đang bị cảm.", "why": "Come down with = bắt đầu bị bệnh.", "tip": ""}]}, {"id": "t2", "e": "📞", "title": "Gọi điện", "turns": [{"a": "Hello, can I speak to Nam?", "b": "___, please. I’ll get him.", "o": ["Hold on", "Hang up", "Back off"], "c": 0, "vi": "Bạn chờ máy nhé. Mình gọi cậu ấy.", "why": "Hold on = chờ máy.", "tip": ""}, {"a": "I’m on the bus. Can he call me back later?", "b": "Sure. He’ll ___ in ten minutes.", "o": ["call you back", "let you down", "cut you off"], "c": 0, "vi": "Được. Cậu ấy sẽ gọi lại sau mười phút.", "why": "Call back = gọi lại.", "tip": "Nói: call you BACK."}, {"a": "Hmm, I can’t hear you well.", "b": "Sorry, the line keeps ___.", "o": ["cutting out", "falling over", "handing in"], "c": 0, "vi": "Xin lỗi, đường truyền cứ chập chờn.", "why": "Cut out = chập chờn, mất tín hiệu.", "tip": ""}, {"a": "OK, I’ll text you instead.", "b": "Good idea. Please don’t ___ on me again!", "o": ["hang up", "hold up", "hand out"], "c": 0, "vi": "Ý hay đấy. Đừng cúp g rồi. Để mình ghi tên trước.", "why": "Write down = ghi lại.", "tip": ""}]}, {"id": "t5", "e": "🌧️", "title": "Kế hoạch đổi", "turns": [{"a": "The match is tomorrow, but it’s going to rain.", "b": "They might ___ if it’s too wet.", "o": ["call it off", "cut it off", "cheer it up"], "c": 0, "vi": "Họ có thể hủy nếu trời quá ướt.", "why": "Call off = hủy.", "tip": "Nói: call it OFF."}, {"a": "What if they just delay it?", "b": "Then we’ll ___ the picnic until next Sunday.", "o": ["put off", "set off", "show off"], "c": 0, "vi": "Vậy mình dời buổi dã ngoại sang Chủ nhật tuần sau.", "why": "Put off = dời lại.", "tip": ""}, {"a": "Will Lan come?", "b": "I hope she ___ this time. She was late last time.", "o": ["shows up", "looks up", "turns off"], "c": 0, "vi": "Mong lần này cô ấy đến. Lần trước cô ấy trễ.", "why": "Show up = có mặt, xuất hiện.", "tip": ""}, {"a": "Guess who I met at the mall?", "b": "Who? Did you ___ someone famous?", "o": ["run into", "run out", "run down"], "c": 0, "vi": "Ai thế? Bạn tình cờ gặp người nổi tiếng à?", "why": "Run into = tình cờ gặp.", "tip": ""}]}];
let TK={sc:0,i:0,ans:null,opts:[],res:[]};
const tkOK=typeof speechSynthesis!=="undefined";
function tkSay(t){try{const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^en-GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang)),u=new SpeechSynthesisUtterance(t);if(v)u.voice=v;u.lang=v?v.lang:"en-US";u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function tkStart(k){TK={sc:k,i:0,ans:null,opts:[],res:[]};tkOpts();buildTalk()}
function tkOpts(){const sc=TALK[TK.sc],t=sc.turns[TK.i];TK.opts=t?rvShuf(t.o):[]}
function buildTalk(){
  const p=$("#p-talk");if(!p)return;
  const sc=TALK[TK.sc],n=sc.turns.length,fin=TK.i>=n,spk=t=>tkOK?`<button class="spk" data-say="${esc(t)}" aria-label="Nghe">🔊</button>`:"";
  if(!TK.opts.length&&!fin)tkOpts();
  let chat="";
  for(let j=0;j<=Math.min(TK.i,n-1);j++){const t=sc.turns[j],shown=j<TK.i||fin||TK.ans!==null;chat+=`<div class="bub a">${esc(t.a)}${spk(t.a)}</div>`;if(shown){const full=t.b.replace("___",t.o[0]);chat+=`<div class="bub b">${esc(full)}${spk(full)}</div>`}}
  let act="";
  if(fin){const good=TK.res.filter(Boolean).length,weak=sc.turns.filter((t,j)=>!TK.res[j]);
    act=`<p class="big"><b>${good}/${n} tự nhiên</b></p>${weak.length?weak.map(t=>`<p class="sub"><b>${esc(t.b.replace("___",t.o[0]))}</b> · ${esc(t.why)}</p>`).join(""):""}<p><button class="btn" id="tkagain">Làm lại</button> <button class="btn ghost" id="tknext">Hội thoại khác →</button></p>`}
  else{const t=sc.turns[TK.i];
    if(TK.ans===null)act=`<p class="sub">Câu ${TK.i+1}/${n} · Chọn câu đáp tự nhiên</p><p class="big">${esc(t.b).replace("___",'<b class="blank">_____</b>')}</p><div class="rvo">${TK.opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    else{const ok=TK.opts[TK.ans]===t.o[0];act=`<p class="${ok?"okm":"nom"}"><b>${ok?"Đúng.":"Chưa đúng."}</b> ${esc(t.b.replace("___",t.o[0]))}</p><p class="sub">${esc(t.why)} · ${esc(t.vi)}</p>${t.tip?`<p class="sub">🗣️ ${esc(t.tip)}</p>`:""}<p><button class="btn" id="tknx">${TK.i+1<n?"Câu tiếp →":"Xem kết quả →"}</button></p>`}}
  p.innerHTML=`<div class="card"><div class="chips" id="tkc">${TALK.map((x,k)=>`<button data-k="${k}"${k===TK.sc?' class="on"':''}>${x.e} ${esc(x.title)}</button>`).join("")}</div><div class="chat">${chat}</div>${act}</div>`;
  p.querySelectorAll("#tkc button").forEach(b=>b.onclick=()=>tkStart(+b.dataset.k));
  p.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>tkSay(b.dataset.say));
  p.querySelectorAll(".rvo button").forEach((b,k)=>b.onclick=()=>{TK.ans=k;TK.res[TK.i]=b.dataset.o===sc.turns[TK.i].o[0];buildTalk()});
  const nx=$("#tknx");if(nx)nx.onclick=()=>{TK.i++;TK.ans=null;TK.opts=[];buildTalk()};
  const ag=$("#tkagain");if(ag)ag.onclick=()=>tkStart(TK.sc);
  const nt=$("#tknext");if(nt)nt.onclick=()=>tkStart((TK.sc+1)%TALK.length);
}

/* ===== ĐỌC VÀ VIẾT (Chặng 5): nghĩa của cụm trong đoạn văn, nâng cấp câu từ nói sang viết. o[0] là đáp án đúng ===== */
const READ=[{"text": "Last month, our school [carried out] a survey about homework. The results [pointed out] that many students sleep less than seven hours. Some teachers [put forward] a plan to give less homework, but the principal [ruled out] the idea because of the coming exams.", "q": [{"w": "carried out", "o": ["tiến hành", "mang đồ ra ngoài cửa", "tiếp tục làm việc đó"], "syn": "conduct"}, {"w": "pointed out", "o": ["chỉ ra, cho thấy", "chỉ tay ra ngoài cửa", "phản đối ý kiến"], "syn": "indicate"}, {"w": "put forward", "o": ["đề xuất", "đặt lên phía trước", "dời lại sang sau"], "syn": "propose"}, {"w": "ruled out", "o": ["loại bỏ, bác bỏ", "cai trị", "vạch đường kẻ"], "syn": "exclude"}]}, {"text": "Heavy traffic has [brought about] many problems in big cities. The mayor wants to [deal with] them quickly, so she [called for] new ideas from citizens. Some students [came up with] a simple plan: build more bike lanes.", "q": [{"w": "brought about", "o": ["gây ra, dẫn đến", "mang đến chỗ khác", "mang trở lại"], "syn": "cause"}, {"w": "deal with", "o": ["giải quyết, xử lý", "chia bài cho người chơi", "chịu đựng"], "syn": "address"}, {"w": "called for", "o": ["kêu gọi", "đến đón ai đó", "gọi điện thoại"], "syn": "request"}, {"w": "came up with", "o": ["nghĩ ra", "đi lên cùng", "theo kịp"], "syn": "devise"}]}, {"text": "The experiment [turned out] better than expected. The team [set out] to test a new plant food, and the plants grew faster. At the end, the scientists [put out] a report to share the results.", "q": [{"w": "turned out", "o": ["hóa ra, cho kết quả", "tắt đi", "đuổi ra ngoài"], "syn": "prove"}, {"w": "set out", "o": ["bắt đầu, nhắm tới", "lên đường đi xa xôi", "bày ra"], "syn": "aim"}, {"w": "put out", "o": ["công bố, phát hành", "dập tắt", "đặt ra ngoài"], "syn": "publish"}]}];
const UPG=[{"s": "The school [called off] the trip for good.", "o": ["cancelled · hủy", "postponed · dời lại", "approved · chấp thuận"], "why": "call off → cancel"}, {"s": "The team [set up] a new lab last year.", "o": ["established · thành lập", "demolished · phá bỏ", "inspected · kiểm tra"], "why": "set up → establish"}, {"s": "Prices [went up] sharply in 2020.", "o": ["increased · tăng", "declined · giảm", "remained · giữ nguyên"], "why": "go up → increase"}, {"s": "We must [cut down on] plastic bags.", "o": ["reduce · giảm bớt", "produce · sản xuất", "import · nhập khẩu"], "why": "cut down on → reduce"}, {"s": "The company [put off] the launch until June.", "o": ["postponed · dời lại", "cancelled · hủy", "advanced · đẩy sớm"], "why": "put off → postpone"}, {"s": "Police are [looking into] the case.", "o": ["investigating · điều tra", "ignoring · phớt lờ", "closing · khép lại"], "why": "look into → investigate"}, {"s": "Heavy rain [set off] a flood.", "o": ["triggered · gây ra", "prevented · ngăn chặn", "predicted · dự đoán"], "why": "set off → trigger"}, {"s": "The report [points out] several problems.", "o": ["indicates · chỉ ra", "ignores · phớt lờ hoàn toàn", "creates · tạo"], "why": "point out → indicate"}, {"s": "Many students can’t [put up with] noisy classrooms.", "o": ["tolerate · chịu đựng", "require · yêu cầu bắt buộc", "design · thiết kế"], "why": "put up with → tolerate"}, {"s": "She [came up with] a clever plan.", "o": ["devised · nghĩ ra, đề ra", "abandoned · bỏ dở", "approved · phê duyệt"], "why": "come up with → devise"}];
let RW={mode:"read",list:[],i:0,ans:null,opts:[],res:[]};
const rwHi=(t,cur)=>{let n=-1;return esc(t).replace(/\[([^\]]+)\]/g,(m,w)=>{n++;return `<b${n===cur?' class="cur"':''}>${w}</b>`})};
function rwStart(){
  RW.list=RW.mode==="read"?READ.flatMap((p,pi)=>p.q.map((q,qi)=>({pi,qi,q}))):rvShuf(UPG).map(u=>({u})).slice(0,10);
  RW.i=0;RW.ans=null;RW.res=[];RW.opts=[];buildRW();
}
function buildRW(){
  const p=$("#p-rw");if(!p)return;
  const chips=`<div class="chips" id="rwc">${[["read","Đọc hiểu"],["up","Nâng cấp câu"]].map(([k,t])=>`<button data-k="${k}"${k===RW.mode?' class="on"':''}>${t}</button>`).join("")}</div>`;
  const n=RW.list.length,fin=n&&RW.i>=n;let body="";
  if(!n)body=`<p class="big">${RW.mode==="read"?"Đọc đoạn văn, chọn nghĩa đúng của cụm in đậm.":"Chọn từ trang trọng thay cho cụm in đậm."}</p><p><button class="btn" id="rwgo">Bắt đầu →</button></p>`;
  else if(fin){const good=RW.res.filter(Boolean).length,weak=RW.list.filter((x,j)=>!RW.res[j]);
    body=`<p class="big"><b>${good}/${n}</b></p>${weak.map(x=>x.q?`<p class="sub"><b>${esc(x.q.w)}</b> = ${esc(x.q.o[0])} · ${esc(x.q.syn)}</p>`:`<p class="sub"><b>${esc(x.u.why)}</b></p>`).join("")}<p><button class="btn" id="rwgo">Lượt mới →</button></p>`}
  else{const x=RW.list[RW.i];if(!RW.opts.length)RW.opts=rvShuf(x.q?x.q.o:x.u.o);
    const head=`<p class="sub">Câu ${RW.i+1}/${n}</p>`;
    const text=x.q?`<p class="pass">${rwHi(READ[x.pi].text,x.qi)}</p><p class="big">“${esc(x.q.w)}” nghĩa là gì?</p>`:`<p class="big">${rwHi(x.u.s,0).replace("<b>",'<b class="cur">')}</p><p class="sub">Từ trang trọng thay cho cụm in đậm?</p>`;
    let act;
    if(RW.ans===null)act=`<div class="rvo">${RW.opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    else{const cor=x.q?x.q.o[0]:x.u.o[0],ok=RW.opts[RW.ans]===cor;
      act=`<p class="${ok?"okm":"nom"}"><b>${ok?"Đúng.":"Chưa đúng."}</b> ${esc(cor)}</p><p class="sub">${x.q?esc(x.q.w)+" ≈ "+esc(x.q.syn):esc(x.u.why)}</p><p><button class="btn" id="rwnx">${RW.i+1<n?"Câu tiếp →":"Xem kết quả →"}</button></p>`}
    body=head+text+act}
  p.innerHTML=`<div class="card">${chips}${body}</div>`;
  p.querySelectorAll("#rwc button").forEach(b=>b.onclick=()=>{RW.mode=b.dataset.k;RW.list=[];RW.i=0;RW.ans=null;RW.opts=[];RW.res=[];buildRW()});
  const go=$("#rwgo");if(go)go.onclick=rwStart;
  p.querySelectorAll(".rvo button").forEach((b,k)=>b.onclick=()=>{const x=RW.list[RW.i],cor=x.q?x.q.o[0]:x.u.o[0];RW.ans=k;RW.res[RW.i]=b.dataset.o===cor;buildRW()});
  const nx=$("#rwnx");if(nx)nx.onclick=()=>{RW.i++;RW.ans=null;RW.opts=[];buildRW()};
}

let vf="all";
function buildVocab(){
  if(vf==="miss"&&!Object.keys(MISS).length)vf="all";
  const p=$("#p-vocab");
  p.innerHTML=`<p class="sub">Đoán nghĩa, rồi bấm thẻ.</p><div class="chips" id="chips"></div><div class="grid" id="grid"></div>`;
  const chips=$("#chips");
  [["all","Tất cả"],...(Object.keys(MISS).length?[["miss","Cần xem lại"]]:[]),...LESSONS.map((l,i)=>[l.id,(i+1)+". "+(l.short||l.title)]),["sch","Theo hạt từ"],["multi","Cụm 3 từ"]].forEach(([id,t])=>{
    const c=document.createElement("button");c.textContent=t;if(id===vf)c.className="on";
    c.onclick=()=>{vf=id;buildVocab()};chips.appendChild(c);
  });
  if(vf==="sch"||vf==="multi")chips.after(lvBar(buildVocab));
  const g=$("#grid");
  (vf==="miss"?Object.values(MISS):vf==="sch"?ALLV().filter(v=>!LV||v.lv===LV).map(v=>({en:v.en,vi:v.vi,ex:v.ex,tag:v.x.p+" · "+LVT[v.lv]})):vf==="multi"?EXTRA.filter(v=>!LV||v.lv===LV).map(v=>({en:v.en,vi:v.vi,tag:"Cụm 3 từ · "+LVT[v.lv]})):VOCAB.filter(v=>vf==="all"||v.lesson===vf)).forEach(v=>{
    const d=document.createElement("button");d.className="fc";
    d.innerHTML=`<div class="tag">${esc(v.tag||"")}</div><div class="en">${esc(v.en)}</div><div class="hint">Bấm để xem nghĩa</div><div class="vi">${esc(v.vi)}${v.ex?`<br><i>${esc(v.ex)}</i>`:""}</div>`;
    d.onclick=()=>d.classList.toggle("open");g.appendChild(d);
  });
  if(vf==="miss"){const c=document.createElement("button");c.className="btn ghost";c.textContent="Xóa danh sách này";c.style.marginTop="14px";c.onclick=()=>{MISS={};saveMiss();vf="all";buildVocab()};p.appendChild(c)}
}
function show(id){
  if(id==="vocab")buildVocab();heroUpdate();
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  const f=$("#p-"+id+" iframe");
  if(f&&!f.srcdoc){const el=document.getElementById("src-"+id);if(el)f.srcdoc=JSON.parse(el.textContent)}
  document.body.classList.toggle("focus",id!=="start");
  location.hash=id;window.scrollTo(0,0);
}
build();heroInit();
